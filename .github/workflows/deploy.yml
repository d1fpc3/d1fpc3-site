name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The FTP account's jail root is one level ABOVE the site: it contains
      # public_html (the d1fpc3.com web root) and Hostinger's DO_NOT_UPLOAD_HERE
      # marker. The account LOGS IN at public_html, but this action resolves
      # server-dir absolutely from the jail root — so it must be /public_html/,
      # never / (a / deploy lands beside the web root, not in it).
      # Hostinger's FTP control socket times out a few times a week. Three
      # attempts, 20s apart, before the run is allowed to go red.
      - name: FTP deploy
        id: ftp1
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            README.md
      - if: steps.ftp1.outcome == 'failure'
        run: sleep 20
      - name: FTP deploy (retry 2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            README.md
      - if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: sleep 20
      - name: FTP deploy (retry 3)
        id: ftp3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            README.md

      - name: Verify live site updated
        run: |
          sleep 10
          # The site root IS the Echelon landing page (moved 2026-08-10).
          TITLE=$(curl -s -A "Mozilla/5.0" https://d1fpc3.com/ | grep -o "<title>[^<]*</title>")
          echo "Live root title: $TITLE"
          case "$TITLE" in
            *Echelon*) echo "Echelon landing live at root." ;;
            *) echo "::error::Root still serving '$TITLE' — FTP sync did not land."; exit 1 ;;
          esac
          TTITLE=$(curl -s -A "Mozilla/5.0" https://d1fpc3.com/templates/ | grep -o "<title>[^<]*</title>")
          echo "Templates title: $TTITLE"
          case "$TTITLE" in
            *"UI Templates"*) echo "Templates live." ;;
            *) echo "::error::/templates/ not serving expected page."; exit 1 ;;
          esac
          # /echelon/ must 301 to the root now; app/welcome stay put.
          ECODE=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" https://d1fpc3.com/echelon/)
          echo "/echelon/ status: $ECODE"
          case "$ECODE" in
            301|308) echo "/echelon/ redirects." ;;
            *) echo "::error::/echelon/ returned $ECODE, expected a 301 redirect to /."; exit 1 ;;
          esac
          ATITLE=$(curl -s -A "Mozilla/5.0" https://d1fpc3.com/echelon/app/ | grep -o "<title>[^<]*</title>")
          echo "Members area title: $ATITLE"
          case "$ATITLE" in
            *Echelon*) echo "Members area live." ;;
            *) echo "::error::/echelon/app/ not serving expected page."; exit 1 ;;
          esac
