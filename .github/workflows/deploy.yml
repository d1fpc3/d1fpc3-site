name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rsync over SSH replaced the FTP action (control-socket timeouts, three
      # retry attempts) on 2026-09-18. It compares the server against the repo
      # on every run, so there is no sync-state file and no retry ladder.
      #
      # supabase/, tests/, docs/ and scripts/ are dev-only. The FTP deploy used
      # to publish them at d1fpc3.com/supabase/... for anyone to read, so they
      # are excluded here and must stay excluded.
      - name: Deploy over SSH (rsync)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_DIR: domains/d1fpc3.com/public_html/
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az --delete --stats \
            --exclude '.git*' --exclude '/.github/' --exclude '/README.md' \
            --exclude '/supabase/' --exclude '/tests/' --exclude '/docs/' --exclude '/scripts/' \
            --filter 'P /.well-known/' --filter 'P /.well-known/**' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR"

      - name: Verify live site updated
        run: |
          sleep 10
          # The site root IS the Echelon landing page (moved 2026-08-10).
          TITLE=$(curl -s -A "Mozilla/5.0" https://d1fpc3.com/ | grep -o "<title>[^<]*</title>")
          echo "Live root title: $TITLE"
          case "$TITLE" in
            *Echelon*) echo "Echelon landing live at root." ;;
            *) echo "::error::Root still serving '$TITLE'. The rsync deploy did not land."; exit 1 ;;
          esac
          TTITLE=$(curl -s -A "Mozilla/5.0" https://d1fpc3.com/templates/ | grep -o "<title>[^<]*</title>")
          echo "Templates title: $TTITLE"
          case "$TTITLE" in
            *"UI Templates"*) echo "Templates live." ;;
            *) echo "::error::/templates/ not serving expected page."; exit 1 ;;
          esac
          # /echelon/ must 301 to the root now; app/welcome stay put.
          ECODE=$(curl -s -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" https://d1fpc3.com/echelon/)
          echo "/echelon/ status: $ECODE"
          case "$ECODE" in
            301|308) echo "/echelon/ redirects." ;;
            *) echo "::error::/echelon/ returned $ECODE, expected a 301 redirect to /."; exit 1 ;;
          esac
          ATITLE=$(curl -s -A "Mozilla/5.0" https://d1fpc3.com/echelon/app/ | grep -o "<title>[^<]*</title>")
          echo "Members area title: $ATITLE"
          case "$ATITLE" in
            *Echelon*) echo "Members area live." ;;
            *) echo "::error::/echelon/app/ not serving expected page."; exit 1 ;;
          esac
