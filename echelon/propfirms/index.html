<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prop firms · Echelon</title>
<meta name="description" content="The main futures prop firms compared at every account size: price with the current code, drawdown rules, targets, payouts.">
<link rel="icon" type="image/svg+xml" href="/echelon-favicon.svg">
<style>
  /* ── flat comparison dashboard in the members-app language: hairlines,
       plain headings, text actions, sparse gold. Same tokens as the app. ── */
  :root {
    --bg: #0b0a09; --panel: #131211; --panel-2: #1a1817; --ink: #f4f2ee; --muted: #9d978c; --faint: #6b665e;
    --line: #262321; --line-bright: #383431; --gold: #c9a24a; --gold-deep: #a8842c;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'IBM Plex Mono', 'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace;
  }
  :root[data-theme="light"] {
    --bg: #f6f4f0; --panel: #ffffff; --panel-2: #efece6; --ink: #1a1815; --muted: #5f5a51; --faint: #8a847a;
    --line: #e4e0d8; --line-bright: #d3cec4; --gold: #a8842c; --gold-deep: #8a6a1e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: var(--gold); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }
  .wrap { max-width: 1480px; margin: 0 auto; padding: 26px clamp(18px, 3vw, 34px) 48px; }
  body.embed .wrap { padding-top: 4px; }

  .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
  .top h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .top p { margin: 4px 0 0; color: var(--faint); font-size: 13px; }
  body.embed .top h1 { display: none; }

  /* the size switch: text, gold underline on the active one */
  .sizes { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin-bottom: 4px; overflow-x: auto; }
  .sizes button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); font: 600 14px var(--font); padding: 10px 2px 12px; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  .sizes button:hover { color: var(--ink); }
  .sizes button.on { color: var(--gold); border-bottom-color: var(--gold); }
  .meta { font-size: 12.5px; color: var(--faint); padding: 8px 0 0; }

  /* one column per firm */
  .firms { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 18px; border-top: 1px solid var(--line); }
  .firm { padding: 20px 18px 18px 18px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); min-width: 0; }
  .firm:nth-child(4n+1) { padding-left: 0; }
  .firm:nth-child(4n) { border-right: 0; padding-right: 0; }
  @media (max-width: 1023px) {
    .firms { grid-template-columns: repeat(2, 1fr); }
    .firm:nth-child(4n+1) { padding-left: 18px; }
    .firm:nth-child(4n) { border-right: 1px solid var(--line); padding-right: 18px; }
    .firm:nth-child(2n+1) { padding-left: 0; }
    .firm:nth-child(2n) { border-right: 0; padding-right: 0; }
  }
  .firm .name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .firm .name a { color: var(--ink); }
  .firm .code { margin-top: 6px; font-size: 12.5px; color: var(--muted); min-height: 19px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .firm .code b { font-family: var(--mono); font-weight: 600; color: var(--ink); letter-spacing: 0.02em; }
  .firm .code .pct { color: var(--gold); font-weight: 600; }
  .firm .code .copy { background: none; border: 0; padding: 0; color: var(--gold); font: 12.5px var(--font); cursor: pointer; }
  .firm .code .copy:hover { text-decoration: underline; text-underline-offset: 2px; }
  .firm .price { margin-top: 16px; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .firm .price .v { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .firm.best .price .v { color: var(--gold); }
  .firm .price .per { font-size: 12.5px; color: var(--faint); }
  .firm .was { font-size: 12.5px; color: var(--faint); margin-top: 6px; }
  .firm .was s { color: var(--faint); }
  .firm .plan { font-size: 13px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .firm .none { color: var(--faint); font-size: 13px; margin-top: 16px; }
  .specs { margin: 16px 0 0; padding: 0; list-style: none; }
  .specs li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
  .specs li span { color: var(--faint); flex: 0 0 auto; }
  .specs li b { font-weight: 500; text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .specs li b.wrap { white-space: normal; }
  .more { display: flex; gap: 16px; margin-top: 14px; }
  .more button { background: none; border: 0; padding: 0; color: var(--gold); font: 13px var(--font); cursor: pointer; }
  .more button:hover { text-decoration: underline; text-underline-offset: 2px; }
  .more button[aria-expanded="true"] { color: var(--muted); }
  .plans, .fine { margin-top: 12px; font-size: 12.5px; }
  .plans[hidden], .fine[hidden] { display: none; }
  .plans .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 7px 0; border-top: 1px solid var(--line); }
  .plans .row .l { min-width: 0; }
  .plans .row .l b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plans .row .l span { color: var(--faint); }
  .plans .row .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .plans .row .r span { display: block; color: var(--faint); font-size: 11.5px; }
  .fine dl { margin: 0; }
  .fine dt { color: var(--faint); font-size: 11.5px; margin-top: 10px; }
  .fine dd { margin: 2px 0 0; color: var(--muted); line-height: 1.5; }

  .foot { margin-top: 22px; font-size: 12.5px; color: var(--faint); }
  .flash { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(8px); background: var(--ink); color: var(--bg); font-size: 13px; padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity 0.18s ease, transform 0.18s ease; pointer-events: none; }
  .flash.on { opacity: 1; transform: translateX(-50%); }
  .loading { padding: 40px 0; color: var(--faint); }

  @media (max-width: 640px) {
    .firms { grid-template-columns: 1fr; border-top: 0; }
    .firm, .firm:nth-child(2n), .firm:nth-child(2n+1) { padding: 18px 0; border-right: 0; }
    .firm .price .v { font-size: 28px; }
    .sizes { gap: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Prop firms</h1>
      <p id="lede">The main futures prop firms, side by side at each account size.</p>
    </div>
  </div>
  <div class="sizes" id="sizes"></div>
  <div class="meta" id="meta"></div>
  <div class="firms" id="firms"><div class="loading">Loading…</div></div>
  <p class="foot" id="foot"></p>
</div>
<div class="flash" id="flash"></div>

<script>
(() => {
  const params = new URLSearchParams(location.search)
  const EMBED = params.get('embed') === '1'
  const DEALS_URL = 'https://prop-deals-discord.frankiepc3.workers.dev/deals.json'
  // the main firms, in the order D1 named them
  const FEATURED = ['apex', 'alpha', 'mffu', 'tradeify', 'tpt', 'topstep', 'lucid', 'fundednext']
  const SIZES = [25000, 50000, 100000, 150000]
  if (EMBED) document.body.classList.add('embed')

  /* theme: system by default; the app passes its own (query + live messages) */
  const setTheme = (t) => document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark')
  setTheme(params.get('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'))
  window.addEventListener('message', (e) => { if (e.origin === location.origin && e.data && e.data.echelonTheme) setTheme(e.data.echelonTheme) })

  const $ = (id) => document.getElementById(id)
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
  const usd = (n) => n == null || Number.isNaN(+n) ? '' : '$' + (Number.isInteger(+n) ? (+n).toLocaleString('en-US') : (+n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }))
  const k = (n) => '$' + (n / 1000) + 'K'
  const DD = { 'trailing-intraday': 'intraday trailing', 'trailing-eod': 'end-of-day trailing', static: 'static' }
  // first clause only, minus source notes in parentheses ("(damnpropfirms Sept 2026)", "(aggregator …)")
  const short = (s, n = 110) => {
    if (!s) return ''
    const first = String(s).replace(/\s*\((?=[^)]*(?:aggregat|damnpropfirm|official|verified|source|snippet|\b20\d\d\b|per\s|reads?\b|help center|homepage))[^)]*\)/gi, '').split(/[.;]\s/)[0].trim()
    return first.length > n ? first.slice(0, n - 1).trimEnd() + '…' : first
  }

  /* ── discount rules (same as the data file's conventions) ── */
  function applies(d, plan) {
    if (!d || d.pct == null) return false
    if (plan.discount) return true
    const a = (d.applies_to || '').toLowerCase()
    if (plan.type === 'evaluation') return !/instant only|funded only|activation only|reset only/.test(a)
    if (/\b(instant|direct)\b[^.;]*\b(not|excluded|no code)\b/.test(a)) return false
    return /\b(all|every)\b[^.;]*\b(plans?|products?|accounts?|purchases?)\b/.test(a) || /\b(instant|direct)\b[^.;]*\b(too|also|includ|as well|eligible|apply|applies|yes|and)\b/.test(a)
  }
  function firmDeal(f, live) {
    const lv = live && live[f.slug] && live[f.slug].code && live[f.slug].pct != null ? live[f.slug] : null
    const better = lv && (!f.discount || !f.discount.code || f.discount.pct == null || lv.pct > f.discount.pct)
    return better ? { code: lv.code, pct: lv.pct, applies_to: f.discount?.applies_to || null, expires: null, live: true } : (f.discount || null)
  }
  function priced(p, d) {
    const pd = p.discount === false ? null : (p.discount ? { ...(d || {}), ...p.discount } : d)
    const ok = applies(pd, p)
    const withCode = ok && p.price != null ? (p.promo_price ?? (p.net ? p.price : Math.round(p.price * (1 - pd.pct / 100)))) : null
    return { ...p, code: ok ? pd.code : null, pct: ok ? pd.pct : null, withCode, eff: withCode ?? p.price }
  }

  /* ── state + render ── */
  let DATA = null, LIVE = null, FIRMS = []
  let size = SIZES.includes(+params.get('size')) ? +params.get('size') : 50000
  const open = { plans: new Set(), fine: new Set() }

  function render() {
    $('sizes').innerHTML = SIZES.map((s) => `<button type="button" data-size="${s}" class="${s === size ? 'on' : ''}">${k(s)}</button>`).join('')
    const cols = FIRMS.map((f) => {
      const d = firmDeal(f, LIVE && LIVE.deals)
      const plans = (f.plans || []).filter((p) => p.size === size).map((p) => priced(p, d)).sort((a, b) => (a.eff ?? 1e9) - (b.eff ?? 1e9))
      const evals = plans.filter((p) => p.type === 'evaluation' && p.price != null)
      return { f, d, plans, best: evals[0] || null }
    })
    const cheapest = Math.min(...cols.filter((c) => c.best).map((c) => c.best.eff))
    $('firms').innerHTML = cols.map((c, i) => {
      const { f, d, plans, best } = c
      const s = f.summary || {}
      let h = `<section class="firm${best && best.eff === cheapest ? ' best' : ''}${i === cols.length - 1 ? ' last-col' : ''}" data-slug="${esc(f.slug)}">`
      h += `<div class="name"><a href="${esc(f.pricing_url || f.site)}" target="_blank" rel="noopener">${esc(f.firm)}</a></div>`
      h += d && d.code ? `<div class="code"><b>${esc(d.code)}</b><span class="pct">${esc(d.pct)}% off</span><button class="copy" type="button" data-code="${esc(d.code)}">Copy</button></div>`
        : d && d.pct != null ? `<div class="code"><span class="pct">${esc(d.pct)}% off</span><span>on-site sale, no code</span></div>`
        : `<div class="code">No code right now</div>`
      if (!best) {
        h += `<p class="none">No ${k(size)} evaluation.</p>`
      } else {
        const per = best.period === 'monthly' ? 'per month' : best.period === 'one-time' ? 'one-time' : ''
        h += `<div class="price"><span class="v">${usd(best.eff)}</span><span class="per">${esc(per)}</span></div>`
        if (best.withCode != null && best.withCode !== best.price) h += `<div class="was"><s>${usd(best.price)}</s> list · ${esc(best.pct)}% off with ${esc(best.code)}</div>`
        else if (best.net && best.code) h += `<div class="was">${esc(best.pct)}% code already in this price</div>`
        else if (best.code == null) h += `<div class="was">List price, no code</div>`
        h += `<div class="plan" title="${esc(best.plan)}">${esc(best.plan)}</div>`
        const dd = best.drawdown != null ? `${usd(best.drawdown)}${best.dd_type ? ' ' + (DD[best.dd_type] || best.dd_type) : ''}` : (best.dd_type ? DD[best.dd_type] || best.dd_type : '')
        const rows = [
          ['Target', usd(best.target)],
          ['Drawdown', dd],
          ['Daily loss', best.daily_loss == null ? 'none' : usd(best.daily_loss)],
          ['Consistency', short(best.consistency ?? s.consistency, 40)],
          ['Min days', best.min_days != null ? String(best.min_days) : ''],
          ['Activation', short(best.activation, 40)],
          ['Reset', best.reset != null ? usd(best.reset) : ''],
          ['Contracts', short(best.contracts, 40)],
          ['Split', short(best.split ?? s.payout_split, 44)],
          ['Payouts', short(best.payout ?? s.payout_schedule, 44)],
        ].filter(([, v]) => v)
        h += `<ul class="specs">${rows.map(([l, v]) => `<li><span>${esc(l)}</span><b title="${esc(v)}">${esc(v)}</b></li>`).join('')}</ul>`
      }
      const pk = f.slug + ':' + size
      h += `<div class="more">${plans.length ? `<button type="button" data-toggle="plans" data-key="${esc(pk)}" aria-expanded="${open.plans.has(pk)}">${open.plans.has(pk) ? 'Hide plans' : `All ${plans.length} plans at ${k(size)}`}</button>` : ''}<button type="button" data-toggle="fine" data-key="${esc(f.slug)}" aria-expanded="${open.fine.has(f.slug)}">${open.fine.has(f.slug) ? 'Hide fine print' : 'Fine print'}</button></div>`
      h += `<div class="plans" ${open.plans.has(pk) ? '' : 'hidden'}>${plans.map((p) => `<div class="row"><div class="l"><b title="${esc(p.plan)}">${esc(p.plan)}</b><span>${esc(p.type === 'evaluation' ? 'Evaluation' : p.type === 'instant' ? 'Instant funded' : 'Direct funded')}${p.dd_type ? ' · ' + esc(DD[p.dd_type] || p.dd_type) : ''}${p.target != null ? ' · target ' + usd(p.target) : ''}</span></div><div class="r">${usd(p.eff)}${p.withCode != null && p.withCode !== p.price ? `<span><s>${usd(p.price)}</s> · ${esc(p.code)}</span>` : `<span>${esc(p.period === 'monthly' ? 'per month' : p.period === 'one-time' ? 'one-time' : '')}</span>`}</div></div>`).join('')}</div>`
      const fine = [
        ['Code applies to', d && d.applies_to], ['Code ends', d && d.expires], ['Funded account', s.funded_type], ['Platforms', s.platforms],
        ['Profit split', s.payout_split], ['Payouts', s.payout_schedule], ['Consistency', s.consistency], ['News trading', s.news_trading], ['Notes', s.notes],
      ].filter(([, v]) => v)
      h += `<div class="fine" ${open.fine.has(f.slug) ? '' : 'hidden'}><dl>${fine.map(([l, v]) => `<dt>${esc(l)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>`
      return h + '</section>'
    }).join('')
    const when = DATA.checked ? new Date(DATA.checked + 'T12:00:00').toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }) : ''
    $('meta').textContent = `Cheapest evaluation at ${k(size)} per firm, with the current code applied. The gold price is the lowest.`
    const liveN = LIVE && LIVE.deals ? Object.keys(LIVE.deals).length : 0
    $('foot').textContent = `Prices checked ${when}${liveN ? `. Codes cross-checked hourly against the prop-deals bot.` : '.'} Prices and codes move weekly, so confirm on the firm's site before you buy.`
  }

  let flashT
  const flash = (msg) => { $('flash').textContent = msg; $('flash').classList.add('on'); clearTimeout(flashT); flashT = setTimeout(() => $('flash').classList.remove('on'), 1400) }
  document.addEventListener('click', (e) => {
    const sz = e.target.closest('.sizes button')
    if (sz) { size = +sz.dataset.size; render(); return }
    const cp = e.target.closest('.copy')
    if (cp) { navigator.clipboard?.writeText(cp.dataset.code).then(() => flash(`Copied ${cp.dataset.code}`)).catch(() => {}); return }
    const tg = e.target.closest('[data-toggle]')
    if (tg) { const set = open[tg.dataset.toggle]; const key = tg.dataset.key; set.has(key) ? set.delete(key) : set.add(key); render() }
  })

  async function boot() {
    try { DATA = await (await fetch('./propfirms.json', { cache: 'no-cache' })).json() }
    catch { $('firms').innerHTML = '<div class="loading">Could not load the firms. Refresh to try again.</div>'; return }
    try { const r = await fetch(DEALS_URL, { cache: 'no-store' }); if (r.ok) LIVE = await r.json() } catch {}
    const by = new Map((DATA.firms || []).filter((f) => f.active !== false).map((f) => [f.slug, f]))
    FIRMS = FEATURED.map((s) => by.get(s)).filter(Boolean)
    render()
  }
  boot()
})()
</script>
</body>
</html>
