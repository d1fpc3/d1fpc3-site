<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Echelon · Join</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root{
      --bg:#0b0a09; --panel:#151311; --line:#2a2622; --line-bright:#3a352f;
      --ink:#e9e4da; --faint:#9a9187; --dim:#6f675d;
      --gold:#c9a24a; --gold-2:#9c7b2e; --ok:#9fce97; --err:#e0a89b;
      color-scheme:dark;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      background:var(--bg); color:var(--ink);
      font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
      display:flex; min-height:100vh; align-items:center; justify-content:center;
      padding:24px; -webkit-text-size-adjust:100%;
    }
    .orb{position:fixed; border-radius:50%; filter:blur(70px); opacity:.4; pointer-events:none; z-index:0}
    .o1{width:340px;height:340px;top:-90px;left:-80px;background:radial-gradient(circle,#3a2c10,transparent 70%)}
    .o2{width:300px;height:300px;bottom:-100px;right:-70px;background:radial-gradient(circle,#241a2e,transparent 70%)}
    .card{position:relative; z-index:1; width:100%; max-width:420px; padding:10px 4px}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
    .mark{
      width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--gold),var(--gold-2)); color:#1a1207;
      font-weight:800;font-size:17px;letter-spacing:-.02em;
    }
    .brand b{font-size:15px;font-weight:650;letter-spacing:.02em}
    h1{font-size:24px;line-height:1.2;letter-spacing:-.02em;margin:0 0 18px}
    label{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:14px 0 7px}
    .inp{
      width:100%; background:#0f0d0b; border:1px solid var(--line); border-radius:11px;
      color:var(--ink); padding:13px 14px; font-size:16px; font-family:inherit;
    }
    .inp:focus{outline:none;border-color:var(--gold)}
    button.go{
      margin-top:22px; width:100%; border:0; border-radius:11px; cursor:pointer;
      background:linear-gradient(135deg,var(--gold),var(--gold-2)); color:#1a1207;
      padding:14px; font-weight:700; font-size:15px; letter-spacing:.01em;
    }
    button.go:disabled{opacity:.55;cursor:default}
    .msg{margin-top:14px;font-size:13.5px;line-height:1.5;display:none}
    .msg.ok{display:block;color:var(--ok)}
    .msg.err{display:block;color:var(--err)}
    .msg a{color:var(--gold);font-weight:600}
    .foot{margin-top:18px;font-size:13px;color:var(--dim)}
    .foot a{color:var(--faint)}
  </style>
</head>
<body>
  <span class="orb o1"></span><span class="orb o2"></span>
  <div class="card" id="card">
    <div class="brand"><span class="mark">E</span><b>ECHELON</b></div>
    <h1>Get in free.</h1>

    <form id="form" autocomplete="on">
      <label for="email">Email</label>
      <input class="inp" id="email" type="email" autocomplete="email" inputmode="email" spellcheck="false" placeholder="you@email.com">

      <label for="pass">Password</label>
      <input class="inp" id="pass" type="password" autocomplete="new-password" placeholder="8+ characters">

      <label for="pass2">Confirm password</label>
      <input class="inp" id="pass2" type="password" autocomplete="new-password" placeholder="Same again">

      <button class="go" id="go" type="submit">Get access</button>
    </form>

    <div id="msg" class="msg"></div>
    <p class="foot">Already in? <a href="/echelon/app/">Sign in</a></p>
  </div>

  <script>
    try { const r = new URLSearchParams(location.search).get('ref'); if (r) localStorage.setItem('echelon-ref', r.toUpperCase()) } catch {}
    const SUPABASE_URL = 'https://cqdignbleethroyxxvzr.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_bUU5exrU1uS4FKw_Dxnp-w_-dNjAo8x'
    const SESSION_KEY = 'sb-cqdignbleethroyxxvzr-auth-token'
    const APP = '/echelon/app/'
    const $ = (id) => document.getElementById(id)
    const msg = $('msg')
    const show = (cls, html) => { msg.className = 'msg ' + cls; msg.innerHTML = html }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const email = $('email').value.trim().toLowerCase()
      const password = $('pass').value
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return show('err', 'Enter a real email.')
      if (password.length < 8) return show('err', 'Password needs 8 characters.')
      if (password !== $('pass2').value) return show('err', "Passwords don't match.")

      $('go').disabled = true; show('', '')
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/free-apply`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY },
          body: JSON.stringify({ email, password, ref: (new URLSearchParams(location.search).get('ref') || localStorage.getItem('echelon-ref') || '').toUpperCase() }),
        })
        const body = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(body.error ?? `Something went wrong (${res.status}).`)

        if (body.already || body.existing) {
          // an account already exists for this email: their own login stands
          show('ok', "You already have an account. <a href='" + APP + "'>Sign in</a>.")
          $('go').disabled = false
          return
        }

        // Fresh account: sign in with the password right here and walk in.
        const tok = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY },
          body: JSON.stringify({ email, password }),
        })
        const session = await tok.json().catch(() => ({}))
        if (session.access_token) {
          try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)) } catch {}
          try { sessionStorage.setItem('echelon-just-signed-in', '1') } catch {}
          location.href = APP
        } else {
          show('ok', "You're in. <a href='" + APP + "'>Sign in</a> with your email and password.")
        }
      } catch (err) {
        show('err', err.message)
        $('go').disabled = false
      }
    })
  </script>
</body>
</html>
