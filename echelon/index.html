<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Echelon</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="description" content="Echelon — a trading course by d1fpc3.">
  <link rel="canonical" href="https://d1fpc3.com/echelon/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://d1fpc3.com/echelon/">
  <meta property="og:title" content="Echelon">
  <meta property="og:description" content="A trading course by d1fpc3.">
  <script async src="https://seenrank.com/pixel.js" data-sr-site="d19bf048-ec87-453a-aa7f-b264637a7360"></script>
  <style>
    /* ─────────────────────────────────────────────────────────
       d1fpc3.com | echelon — sales page

       Deliberately withholding: no curriculum, no lesson list, no
       counts. What is inside is for people who have paid. The page
       sells the outcome and the person, not the table of contents.

       House language, inverted for a paid product: flat
       typographic rows, hairline dividers, sparse gold, no cards
       and no pills.
       ───────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --ink: #f4f2ee;
      --muted: #9d978c;
      --faint: #6b665e;
      --line: #242220;
      --line-bright: #35322e;
      --gold: #a8842c;
      --gold-bright: #c9a24a;
    }

    html { height: 100%; scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: 100%;
      max-width: 660px;
      margin: 0 auto;
      padding-left: clamp(22px, 6vw, 40px);
      padding-right: clamp(22px, 6vw, 40px);
    }

    a { color: inherit; }

    .label {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--faint);
    }

    /* ── hero ───────────────────────────────────────────────── */

    header { padding-top: clamp(56px, 14vh, 128px); }

    .eyebrow { color: var(--gold); }

    h1 {
      font-weight: 700;
      font-size: clamp(56px, 16vw, 104px);
      line-height: 0.9;
      letter-spacing: -0.048em;
      margin-top: 18px;
    }

    .sub {
      margin-top: 26px;
      color: var(--muted);
      font-size: clamp(17px, 3.6vw, 19px);
      max-width: 40ch;
    }

    /* ── buy ────────────────────────────────────────────────── */

    .buy {
      margin-top: 34px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 16px 32px;
      background: var(--gold);
      color: #0a0a0a;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-decoration: none;
      border: 1px solid var(--gold);
      border-radius: 2px;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .btn:hover, .btn:focus-visible {
      background: var(--gold-bright);
      border-color: var(--gold-bright);
      transform: translateY(-1px);
    }

    .btn[aria-disabled="true"] {
      background: transparent;
      color: var(--faint);
      border-color: var(--line-bright);
      cursor: not-allowed;
      transform: none;
    }

    /* The free door. Present, but it must not out-shout the paid one. */
    .btn.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line-bright); }
    .btn.btn-ghost:hover, .btn.btn-ghost:focus-visible {
      background: transparent; border-color: var(--gold); color: var(--gold); transform: none;
    }

    .price-note { font-size: 14px; color: var(--muted); }
    .price-note strong { color: var(--ink); font-weight: 600; }

    /* ── sections ───────────────────────────────────────────── */

    section { padding: clamp(54px, 11vh, 92px) 0 0; }

    .section-head { padding-bottom: 16px; border-bottom: 1px solid var(--line-bright); }

    h2 {
      font-weight: 600;
      font-size: clamp(27px, 6vw, 36px);
      line-height: 1.12;
      letter-spacing: -0.03em;
      margin-top: 22px;
      max-width: 22ch;
    }

    .section-body { margin-top: 16px; color: var(--muted); max-width: 50ch; }

    /* ── coming ─────────────────────────────────────────────── */

    .coming-note {
      margin-top: 24px;
      padding: 15px 0;
      border-top: 1px solid var(--line-bright);
      border-bottom: 1px solid var(--line-bright);
      font-size: 14px;
      color: var(--gold);
      max-width: 50ch;
    }

    /* ── list ───────────────────────────────────────────────── */

    ul.plain { list-style: none; margin-top: 22px; }

    ul.plain li {
      padding: 14px 0 14px 22px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      position: relative;
      max-width: 52ch;
    }

    ul.plain li::before {
      content: "";
      position: absolute;
      left: 0; top: 27px; /* centred on the first line, not above it */
      width: 7px; height: 1px;
      background: var(--gold);
    }

    /* ── faq ────────────────────────────────────────────────── */

    .faq-item { padding: 19px 0; border-bottom: 1px solid var(--line); }
    .faq-q { font-weight: 600; letter-spacing: -0.012em; }
    .faq-a { margin-top: 7px; color: var(--muted); font-size: 15px; max-width: 52ch; }

    /* ── footer ─────────────────────────────────────────────── */

    footer { margin-top: clamp(64px, 12vh, 100px); padding-bottom: 36px; }

    .foot {
      border-top: 1px solid var(--line-bright);
      padding-top: 17px;
      font-size: 11.5px;
      letter-spacing: 0.04em;
      color: var(--faint);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .foot a { text-decoration: none; transition: color 0.2s ease; }
    .foot a:hover, .foot a:focus-visible { color: var(--gold); }

    /* ── entrance ───────────────────────────────────────────── */

    @media (prefers-reduced-motion: no-preference) {
      .rise { opacity: 0; transform: translateY(11px); animation: rise 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      header .rise:nth-child(1) { animation-delay: 0s; }
      header .rise:nth-child(2) { animation-delay: 0.07s; }
      header .rise:nth-child(3) { animation-delay: 0.14s; }
      header .rise:nth-child(4) { animation-delay: 0.21s; }
      @keyframes rise { to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>

  <header class="wrap">
    <p class="label eyebrow rise" id="eyebrow"></p>
    <h1 class="rise" id="name"></h1>
    <p class="sub rise" id="subhead"></p>
    <div class="buy rise">
      <a class="btn" id="cta-top" href="#">Get Echelon</a>
      <span class="price-note"><strong id="price-top"></strong> <span id="price-terms"></span></span>
    </div>
  </header>

  <main>

    <!-- The free door, high on the page on purpose. -->
    <section class="wrap" id="discord" hidden>
      <div class="section-head"><p class="label">Free to join</p></div>
      <h2 id="discord-title"></h2>
      <p class="section-body" id="discord-body"></p>
      <div class="buy">
        <a class="btn btn-ghost" id="discord-cta" href="#" target="_blank" rel="noopener">Join the Discord</a>
        <span class="price-note"><strong>Free.</strong> <span id="discord-terms"></span></span>
      </div>
    </section>

    <section class="wrap" id="for">
      <div class="section-head"><p class="label">Who it's for</p></div>
      <h2 id="for-title"></h2>
      <ul class="plain" id="for-list"></ul>
    </section>

    <section class="wrap" id="coming">
      <div class="section-head"><p class="label">On its way</p></div>
      <h2 id="coming-title"></h2>
      <p class="section-body" id="coming-body"></p>
      <p class="coming-note" id="coming-note"></p>
    </section>

    <section class="wrap" id="faq">
      <div class="section-head"><p class="label">Questions</p></div>
      <div id="faq-list"></div>
    </section>

    <section class="wrap">
      <div class="section-head"><p class="label">Get started</p></div>
      <h2 id="close-title"></h2>
      <p class="section-body" id="close-body"></p>
      <div class="buy">
        <a class="btn" id="cta-bottom" href="#">Get Echelon</a>
        <span class="price-note"><strong id="price-bottom"></strong> <span id="price-terms-2"></span></span>
      </div>
    </section>

  </main>

  <footer>
    <div class="wrap">
      <div class="foot">
        <span>© 2026 d1fpc3</span>
        <span>
          <a id="foot-discord" href="#" target="_blank" rel="noopener" hidden>Discord</a>
          <span id="foot-discord-sep" hidden>&nbsp;·&nbsp;</span>
          <a href="/echelon/app/">Already bought? Sign in</a>
          &nbsp;·&nbsp;
          <a href="/">d1fpc3.com</a>
        </span>
      </div>
    </div>
  </footer>

  <script type="module">
    // ═══════════════════════════════════════════════════════════
    //  EDITABLE COPY — change here, no hunting through markup.
    //  Nothing on this page describes what is inside the course.
    //  Keep it that way if that is the intent.
    // ═══════════════════════════════════════════════════════════
    const copy = {
      eyebrow: 'A course by d1fpc3',
      name:    'Echelon',
      subhead: 'The way I trade NQ, put in one place.',

      price:      '$200',
      priceTerms: 'once. Yours for good.',

      discordTitle: 'Start free in the Discord.',
      discordBody:  'The room where I post the calendar, my notes, and what I am watching. Free to join, no card.',
      discordTerms: 'Nothing to cancel.',

      forTitle: 'For the trader who already knows enough.',
      forList: [
        'You have watched more content than you can count and still do not have a plan written down.',
        'You can call the move after it happens, and hesitate at the moment it actually matters.',
        'Your winners are fine. It is the size of your losers keeping you flat.',
      ],

      comingTitle: 'The D1 Engine indicator is on its way.',
      comingBody:  'The tool I have been building alongside everything else on my TradingView profile.',
      comingNote:  'Not released yet. Everyone who buys Echelon gets it free when it ships.',

      faq: [
        { q: 'How long do I have access?',
          a: 'Forever. One payment, no renewal.' },
        { q: 'What if it is not for me?',
          a: 'REPLACE: your refund policy. This is the one line I will not write for you.' },
        { q: 'How do I get in after I buy?',
          a: 'You land straight in the course the moment you pay. Coming back later, you sign in with your email and we send you a link.' },
      ],

      closeTitle: 'Echelon.',
      closeBody:  'One payment. Yours for good.',
    }

    // ═══════════════════════════════════════════════════════════
    //  The Stripe Payment Link. Create a $200 one-time product,
    //  set its confirmation page to
    //    https://d1fpc3.com/echelon/welcome/?session_id={CHECKOUT_SESSION_ID}
    //  and paste the link URL here. Until it is set, the buy
    //  buttons say so rather than silently going nowhere.
    // ═══════════════════════════════════════════════════════════
    const PAYMENT_LINK = ''

    // ═══════════════════════════════════════════════════════════
    //  The free Discord invite. Use a permanent, non-expiring
    //  invite — Discord defaults to 7 days, which would quietly
    //  turn this into a dead link a week after launch. Left blank,
    //  the section stays hidden rather than shipping a button
    //  that goes nowhere.
    // ═══════════════════════════════════════════════════════════
    const DISCORD_INVITE = ''

    // ── copy into the page ──────────────────────────────────
    const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text }

    set('eyebrow', copy.eyebrow)
    set('name', copy.name)
    set('subhead', copy.subhead)
    set('discord-title', copy.discordTitle)
    set('discord-body', copy.discordBody)
    set('discord-terms', copy.discordTerms)
    set('for-title', copy.forTitle)
    set('coming-title', copy.comingTitle)
    set('coming-body', copy.comingBody)
    set('coming-note', copy.comingNote)
    set('close-title', copy.closeTitle)
    set('close-body', copy.closeBody)
    set('price-top', copy.price)
    set('price-bottom', copy.price)
    set('price-terms', copy.priceTerms)
    set('price-terms-2', copy.priceTerms)

    const forList = document.getElementById('for-list')
    for (const item of copy.forList) {
      const li = document.createElement('li')
      li.textContent = item
      forList.appendChild(li)
    }

    const faqList = document.getElementById('faq-list')
    for (const { q, a } of copy.faq) {
      const item = document.createElement('div')
      item.className = 'faq-item'
      const qEl = document.createElement('p')
      qEl.className = 'faq-q'
      qEl.textContent = q
      const aEl = document.createElement('p')
      aEl.className = 'faq-a'
      aEl.textContent = a
      item.append(qEl, aEl)
      faqList.appendChild(item)
    }

    if (DISCORD_INVITE) {
      document.getElementById('discord-cta').href = DISCORD_INVITE
      document.getElementById('discord').hidden = false
      const footLink = document.getElementById('foot-discord')
      footLink.href = DISCORD_INVITE
      footLink.hidden = false
      document.getElementById('foot-discord-sep').hidden = false
    }

    for (const id of ['cta-top', 'cta-bottom']) {
      const btn = document.getElementById(id)
      if (PAYMENT_LINK) {
        btn.href = PAYMENT_LINK
      } else {
        btn.href = '#'
        btn.setAttribute('aria-disabled', 'true')
        btn.textContent = 'Checkout not connected yet'
        btn.addEventListener('click', (e) => e.preventDefault())
      }
    }
  </script>
</body>
</html>
