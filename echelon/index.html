<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Echelon</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="description" content="Echelon — REPLACE with the one-line promise. A course by d1fpc3.">
  <!-- REMOVE THIS LINE when the real copy is in. Until then, placeholder text
       should not be what Google learns this page says. -->
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://d1fpc3.com/echelon/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://d1fpc3.com/echelon/">
  <meta property="og:title" content="Echelon">
  <meta property="og:description" content="REPLACE with the one-line promise.">
  <script async src="https://seenrank.com/pixel.js" data-sr-site="d19bf048-ec87-453a-aa7f-b264637a7360"></script>
  <style>
    /* ─────────────────────────────────────────────────────────
       d1fpc3.com | echelon — sales page

       The house language inverted for a paid product: flat
       typographic rows, hairline dividers, sparse gold, no cards
       and no pills. Dark, because this one costs money.

       The curriculum is not written here. It is read at runtime
       from the public `curriculum` view, so editing the course
       edits this page.
       ───────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --ink: #f4f2ee;
      --muted: #8f8a80;
      --faint: #5f5b54;
      --line: #222020;
      --gold: #a8842c;
      --gold-bright: #c9a24a;
    }

    html { height: 100%; scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding-left: clamp(20px, 6vw, 40px);
      padding-right: clamp(20px, 6vw, 40px);
    }

    a { color: inherit; }

    .label {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
    }

    /* ── hero ───────────────────────────────────────────────── */

    header { padding-top: clamp(48px, 11vh, 104px); }

    .eyebrow { color: var(--gold); }

    h1 {
      font-weight: 700;
      font-size: clamp(44px, 12vw, 76px);
      line-height: 0.98;
      letter-spacing: -0.04em;
      margin-top: 18px;
    }

    .promise {
      margin-top: 20px;
      font-size: clamp(17px, 4vw, 20px);
      line-height: 1.5;
      color: var(--ink);
      max-width: 26ch;
      letter-spacing: -0.01em;
    }

    .sub {
      margin-top: 16px;
      color: var(--muted);
      max-width: 48ch;
    }

    /* ── buy ────────────────────────────────────────────────── */

    .buy {
      margin-top: 34px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 15px 30px;
      background: var(--gold);
      color: #0a0a0a;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-decoration: none;
      border: 1px solid var(--gold);
      border-radius: 2px;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .btn:hover, .btn:focus-visible {
      background: var(--gold-bright);
      border-color: var(--gold-bright);
      transform: translateY(-1px);
    }

    .btn[aria-disabled="true"] {
      background: transparent;
      color: var(--faint);
      border-color: var(--line);
      cursor: not-allowed;
      transform: none;
    }

    .price-note { font-size: 13px; color: var(--muted); }
    .price-note strong { color: var(--ink); font-weight: 600; }

    /* ── sections ───────────────────────────────────────────── */

    section { padding: clamp(46px, 9vh, 78px) 0 0; }

    .section-head {
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    h2 {
      font-weight: 600;
      font-size: clamp(24px, 5.5vw, 30px);
      line-height: 1.15;
      letter-spacing: -0.025em;
      margin-top: 20px;
    }

    .section-body { margin-top: 16px; color: var(--muted); max-width: 52ch; }

    /* ── curriculum ─────────────────────────────────────────── */

    .module { margin-top: 30px; }

    .module-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .module-title {
      font-weight: 600;
      font-size: 17px;
      letter-spacing: -0.015em;
    }

    .module-count { font-size: 11px; letter-spacing: 0.1em; color: var(--faint); white-space: nowrap; }

    .module-summary { margin-top: 10px; color: var(--muted); font-size: 14px; }

    .lesson {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    .lesson-num {
      font-size: 11px;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
      min-width: 1.6em;
    }

    .lesson-title { flex: 1; }

    .lesson-meta {
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--faint);
      white-space: nowrap;
    }

    /* a small rounded rect, never a capsule */
    .free {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 3px;
      padding: 2px 6px;
      white-space: nowrap;
    }

    .curriculum-loading, .curriculum-error { margin-top: 26px; color: var(--faint); font-size: 14px; }

    /* ── preview ────────────────────────────────────────────── */

    .preview-body {
      margin-top: 22px;
      padding: 22px 0 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
    }

    .preview-body h2, .preview-body h3 {
      color: var(--ink);
      font-size: 17px;
      font-weight: 600;
      margin: 18px 0 8px;
      letter-spacing: -0.015em;
    }

    .preview-body p { margin-bottom: 12px; }

    /* ── list ───────────────────────────────────────────────── */

    ul.plain { list-style: none; margin-top: 20px; }

    ul.plain li {
      padding: 12px 0 12px 20px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      position: relative;
    }

    ul.plain li::before {
      content: "";
      position: absolute;
      left: 0; top: 25px; /* centred on the first line, not above it */
      width: 6px; height: 1px;
      background: var(--gold);
    }

    /* ── faq ────────────────────────────────────────────────── */

    .faq-item { padding: 18px 0; border-bottom: 1px solid var(--line); }
    .faq-q { font-weight: 600; letter-spacing: -0.01em; }
    .faq-a { margin-top: 7px; color: var(--muted); font-size: 14px; }

    /* ── close ──────────────────────────────────────────────── */

    .close { text-align: left; }
    .close h2 { max-width: 18ch; }

    /* ── footer ─────────────────────────────────────────────── */

    footer { margin-top: clamp(56px, 10vh, 90px); padding-bottom: 34px; }

    .foot {
      border-top: 1px solid var(--line);
      padding-top: 16px;
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--faint);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .foot a { text-decoration: none; transition: color 0.2s ease; }
    .foot a:hover, .foot a:focus-visible { color: var(--gold); }

    /* ── entrance ───────────────────────────────────────────── */

    @media (prefers-reduced-motion: no-preference) {
      .rise { opacity: 0; transform: translateY(10px); animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      header .rise:nth-child(1) { animation-delay: 0s; }
      header .rise:nth-child(2) { animation-delay: 0.06s; }
      header .rise:nth-child(3) { animation-delay: 0.12s; }
      header .rise:nth-child(4) { animation-delay: 0.18s; }
      header .rise:nth-child(5) { animation-delay: 0.24s; }
      @keyframes rise { to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>

  <header class="wrap">
    <p class="label eyebrow rise" id="eyebrow"></p>
    <h1 class="rise" id="name"></h1>
    <p class="promise rise" id="promise"></p>
    <p class="sub rise" id="subhead"></p>
    <div class="buy rise">
      <a class="btn" id="cta-top" href="#">Get Echelon</a>
      <span class="price-note"><strong id="price-top"></strong> <span id="price-terms"></span></span>
    </div>
  </header>

  <main>

    <section class="wrap" id="for">
      <div class="section-head"><p class="label">Who it's for</p></div>
      <h2 id="for-title"></h2>
      <ul class="plain" id="for-list"></ul>
    </section>

    <section class="wrap" id="inside">
      <div class="section-head"><p class="label">What's inside</p></div>
      <h2 id="inside-title"></h2>
      <p class="section-body" id="inside-body"></p>
      <div id="curriculum">
        <p class="curriculum-loading">Loading the outline…</p>
      </div>
    </section>

    <section class="wrap" id="preview" hidden>
      <div class="section-head"><p class="label">Free preview</p></div>
      <h2 id="preview-title"></h2>
      <p class="section-body">The first lesson, in full, before you pay anything.</p>
      <div class="preview-body" id="preview-body"></div>
    </section>

    <section class="wrap" id="faq">
      <div class="section-head"><p class="label">Questions</p></div>
      <div id="faq-list"></div>
    </section>

    <section class="wrap close">
      <div class="section-head"><p class="label">Get started</p></div>
      <h2 id="close-title"></h2>
      <p class="section-body" id="close-body"></p>
      <div class="buy">
        <a class="btn" id="cta-bottom" href="#">Get Echelon</a>
        <span class="price-note"><strong id="price-bottom"></strong> <span id="price-terms-2"></span></span>
      </div>
    </section>

  </main>

  <footer>
    <div class="wrap">
      <div class="foot">
        <span>© 2026 d1fpc3</span>
        <span>
          <a href="/echelon/app/">Already bought? Sign in</a>
          &nbsp;·&nbsp;
          <a href="/">d1fpc3.com</a>
        </span>
      </div>
    </div>
  </footer>

  <script type="module">
    // ═══════════════════════════════════════════════════════════
    //  EDITABLE COPY — change here, no hunting through markup.
    //  Everything below marked REPLACE is placeholder.
    // ═══════════════════════════════════════════════════════════
    const copy = {
      eyebrow:  'A course by d1fpc3',
      name:     'Echelon',
      promise:  'REPLACE: the outcome, in one line.',
      subhead:  'REPLACE: two sentences on what this is and who it changes things for. Say the specific thing, not the category.',

      price:      '$200',
      priceTerms: 'once. Yours for good.',

      forTitle: 'REPLACE: name the person reading this.',
      forList: [
        'REPLACE: a situation they recognise as theirs.',
        'REPLACE: the thing they have already tried that did not work.',
        'REPLACE: what they want that this actually delivers.',
      ],

      insideTitle: 'REPLACE: what they get, stated plainly.',
      insideBody:  'REPLACE: one paragraph on the shape of the thing. The outline below is live — it is the real course structure, read straight from the database.',

      faq: [
        { q: 'How long do I have access?',      a: 'Forever. One payment, no renewal.' },
        { q: 'REPLACE: their biggest objection?', a: 'REPLACE: answer it honestly and briefly.' },
        { q: 'Do you offer refunds?',            a: 'REPLACE: state your actual policy.' },
        { q: 'How do I get in after I buy?',     a: 'You land straight in the course the moment you pay. Coming back later, you sign in with your email and we send you a link.' },
      ],

      closeTitle: 'REPLACE: the last thing they need to hear.',
      closeBody:  'REPLACE: one short paragraph. No pressure tactics.',
    }

    // ═══════════════════════════════════════════════════════════
    //  The Stripe Payment Link. Create a $200 one-time product in
    //  Stripe, then set its confirmation page to:
    //    https://d1fpc3.com/echelon/welcome/?session_id={CHECKOUT_SESSION_ID}
    //  and paste the link URL here. Until it is set, the buy
    //  buttons say so rather than silently going nowhere.
    // ═══════════════════════════════════════════════════════════
    const PAYMENT_LINK = ''

    const SUPABASE_URL = 'https://cqdignbleethroyxxvzr.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_bUU5exrU1uS4FKw_Dxnp-w_-dNjAo8x'

    // ── copy into the page ──────────────────────────────────
    const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text }

    set('eyebrow', copy.eyebrow)
    set('name', copy.name)
    set('promise', copy.promise)
    set('subhead', copy.subhead)
    set('for-title', copy.forTitle)
    set('inside-title', copy.insideTitle)
    set('inside-body', copy.insideBody)
    set('close-title', copy.closeTitle)
    set('close-body', copy.closeBody)
    set('price-top', copy.price)
    set('price-bottom', copy.price)
    set('price-terms', copy.priceTerms)
    set('price-terms-2', copy.priceTerms)
    document.title = copy.name

    const forList = document.getElementById('for-list')
    for (const item of copy.forList) {
      const li = document.createElement('li')
      li.textContent = item
      forList.appendChild(li)
    }

    const faqList = document.getElementById('faq-list')
    for (const { q, a } of copy.faq) {
      const item = document.createElement('div')
      item.className = 'faq-item'
      const qEl = document.createElement('p')
      qEl.className = 'faq-q'
      qEl.textContent = q
      const aEl = document.createElement('p')
      aEl.className = 'faq-a'
      aEl.textContent = a
      item.append(qEl, aEl)
      faqList.appendChild(item)
    }

    for (const id of ['cta-top', 'cta-bottom']) {
      const btn = document.getElementById(id)
      if (PAYMENT_LINK) {
        btn.href = PAYMENT_LINK
      } else {
        btn.href = '#'
        btn.setAttribute('aria-disabled', 'true')
        btn.textContent = 'Checkout not connected yet'
        btn.addEventListener('click', (e) => e.preventDefault())
      }
    }

    // ── curriculum, live from the database ──────────────────
    // Reads the public `curriculum` view: titles and runtimes only.
    // Bodies, video ids and file paths are not exposed to this page.
    const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`

    function runtime(secs) {
      if (!secs) return null
      const m = Math.round(secs / 60)
      return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${m % 60}m`
    }

    function renderCurriculum(rows) {
      const host = document.getElementById('curriculum')
      host.textContent = ''

      if (!rows.length) {
        host.innerHTML = '<p class="curriculum-error">Outline coming shortly.</p>'
        return
      }

      const modules = new Map()
      for (const r of rows) {
        if (!modules.has(r.module_slug)) {
          modules.set(r.module_slug, { title: r.module_title, summary: r.module_summary, lessons: [] })
        }
        modules.get(r.module_slug).lessons.push(r)
      }

      let n = 0
      for (const mod of modules.values()) {
        const wrap = document.createElement('div')
        wrap.className = 'module'

        const head = document.createElement('div')
        head.className = 'module-head'
        const title = document.createElement('span')
        title.className = 'module-title'
        title.textContent = mod.title
        const count = document.createElement('span')
        count.className = 'module-count'
        count.textContent = plural(mod.lessons.length, 'lesson')
        head.append(title, count)
        wrap.appendChild(head)

        if (mod.summary) {
          const s = document.createElement('p')
          s.className = 'module-summary'
          s.textContent = mod.summary
          wrap.appendChild(s)
        }

        for (const l of mod.lessons) {
          n += 1
          const row = document.createElement('div')
          row.className = 'lesson'

          const num = document.createElement('span')
          num.className = 'lesson-num'
          num.textContent = String(n).padStart(2, '0')

          const t = document.createElement('span')
          t.className = 'lesson-title'
          t.textContent = l.lesson_title

          row.append(num, t)

          if (l.is_preview) {
            const free = document.createElement('span')
            free.className = 'free'
            free.textContent = 'Free'
            row.appendChild(free)
          }

          const meta = document.createElement('span')
          meta.className = 'lesson-meta'
          meta.textContent = runtime(l.duration_secs) ?? l.kind
          row.appendChild(meta)

          wrap.appendChild(row)
        }

        host.appendChild(wrap)
      }

      const total = document.createElement('p')
      total.className = 'curriculum-loading'
      total.textContent = `${plural(modules.size, 'module')}, ${plural(n, 'lesson')}.`
      host.appendChild(total)
    }

    // ── the free preview lesson, in full ────────────────────
    // Readable by anon because RLS lets preview rows through.
    function renderPreview(lesson) {
      if (!lesson?.body_md) return
      document.getElementById('preview').hidden = false
      document.getElementById('preview-title').textContent = lesson.title

      // Deliberately minimal: headings and paragraphs, escaped. This renders
      // your own lesson text, but it renders it as text, not as markup.
      const host = document.getElementById('preview-body')
      for (const block of lesson.body_md.split(/\n{2,}/)) {
        const trimmed = block.trim()
        if (!trimmed) continue
        const heading = trimmed.match(/^(#{2,3})\s+(.*)$/)
        const el = document.createElement(heading ? (heading[1].length === 2 ? 'h2' : 'h3') : 'p')
        el.textContent = heading ? heading[2] : trimmed
        host.appendChild(el)
      }
    }

    async function rest(path) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
      })
      if (!res.ok) throw new Error(`${res.status}`)
      return res.json()
    }

    try {
      const [rows, previews] = await Promise.all([
        rest('curriculum?select=*&order=module_position.asc,lesson_position.asc'),
        rest('lessons?select=title,body_md&is_preview=eq.true&kind=eq.written&limit=1'),
      ])
      renderCurriculum(rows)
      renderPreview(previews[0])
    } catch (err) {
      console.error('curriculum load failed', err)
      document.getElementById('curriculum').innerHTML =
        '<p class="curriculum-error">Outline coming shortly.</p>'
    }
  </script>
</body>
</html>
