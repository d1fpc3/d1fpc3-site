  <style>
    /* ─────────────────────────────────────────────────────────
       d1fpc3.com | echelon — sales page

       The house language, inverted for a paid product: flat
       typographic rows, hairline dividers, sparse gold, no cards
       and no pills. Dark, because this one costs money.

       The curriculum is not written here. It is read at runtime
       from the public `curriculum` view, so editing the course
       edits this page — including the counts in the hero.
       ───────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --ink: #f4f2ee;
      --muted: #9d978c;
      --faint: #6b665e;
      --line: #242220;
      --line-bright: #35322e;
      --gold: #a8842c;
      --gold-bright: #c9a24a;
    }

    html { height: 100%; scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: 100%;
      max-width: 660px;
      margin: 0 auto;
      padding-left: clamp(22px, 6vw, 40px);
      padding-right: clamp(22px, 6vw, 40px);
    }

    a { color: inherit; }

    .label {
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--faint);
    }

    /* ── hero ───────────────────────────────────────────────── */

    header { padding-top: clamp(52px, 12vh, 112px); }

    .eyebrow { color: var(--gold); }

    h1 {
      font-weight: 700;
      font-size: clamp(52px, 15vw, 96px);
      line-height: 0.92;
      letter-spacing: -0.045em;
      margin-top: 16px;
    }

    .promise {
      margin-top: 26px;
      font-size: clamp(20px, 4.6vw, 26px);
      line-height: 1.32;
      letter-spacing: -0.022em;
      max-width: 20ch;
      font-weight: 500;
    }

    .sub {
      margin-top: 18px;
      color: var(--muted);
      max-width: 46ch;
    }

    /* ── stat strip: hairlines, never boxes ─────────────────── */

    .stats {
      margin-top: 34px;
      border-top: 1px solid var(--line-bright);
      border-bottom: 1px solid var(--line-bright);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
    }

    .stat { padding: 14px 0; }
    .stat + .stat { border-left: 1px solid var(--line); padding-left: 16px; }

    .stat-n {
      font-size: 19px;
      font-weight: 600;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .stat-l {
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--faint);
      margin-top: 1px;
    }

    @media (max-width: 460px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .stat:nth-child(3) { border-left: none; padding-left: 0; }
      .stat:nth-child(3), .stat:nth-child(4) { border-top: 1px solid var(--line); }
    }

    /* ── buy ────────────────────────────────────────────────── */

    .buy {
      margin-top: 30px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 16px 32px;
      background: var(--gold);
      color: #0a0a0a;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      text-decoration: none;
      border: 1px solid var(--gold);
      border-radius: 2px;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .btn:hover, .btn:focus-visible {
      background: var(--gold-bright);
      border-color: var(--gold-bright);
      transform: translateY(-1px);
    }

    .btn[aria-disabled="true"] {
      background: transparent;
      color: var(--faint);
      border-color: var(--line-bright);
      cursor: not-allowed;
      transform: none;
    }

    /* The free door. Present, but it must not out-shout the paid one. */
    .btn.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line-bright); }
    .btn.btn-ghost:hover, .btn.btn-ghost:focus-visible {
      background: transparent; border-color: var(--gold); color: var(--gold); transform: none;
    }

    .price-note { font-size: 14px; color: var(--muted); }
    .price-note strong { color: var(--ink); font-weight: 600; }

    /* ── sections ───────────────────────────────────────────── */

    section { padding: clamp(52px, 10vh, 88px) 0 0; }

    .section-head { padding-bottom: 16px; border-bottom: 1px solid var(--line-bright); }

    h2 {
      font-weight: 600;
      font-size: clamp(27px, 6vw, 36px);
      line-height: 1.12;
      letter-spacing: -0.03em;
      margin-top: 22px;
      max-width: 22ch;
    }

    .section-body { margin-top: 16px; color: var(--muted); max-width: 50ch; }

    /* ── curriculum ─────────────────────────────────────────── */

    .module { margin-top: 34px; }

    .module-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line-bright);
    }

    .module-title { font-weight: 600; font-size: 18px; letter-spacing: -0.02em; }
    .module-count { font-size: 11px; letter-spacing: 0.1em; color: var(--faint); white-space: nowrap; }
    .module-summary { margin-top: 11px; color: var(--muted); font-size: 14.5px; max-width: 48ch; }

    .lesson {
      display: flex;
      align-items: baseline;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
    }

    .lesson-num {
      font-size: 11px;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
      min-width: 1.6em;
    }

    .lesson-title { flex: 1; }

    .lesson-meta {
      font-size: 11px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--faint);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    /* a small rounded rect, never a capsule */
    .free {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold);
      border-radius: 3px;
      padding: 2px 6px;
      white-space: nowrap;
    }

    .curriculum-total { margin-top: 24px; color: var(--faint); font-size: 14px; }
    .curriculum-error { margin-top: 26px; color: var(--faint); font-size: 14px; }

    /* ── coming ─────────────────────────────────────────────── */

    .coming-note {
      margin-top: 24px;
      padding: 15px 0;
      border-top: 1px solid var(--line-bright);
      border-bottom: 1px solid var(--line-bright);
      font-size: 14px;
      color: var(--gold);
      max-width: 50ch;
    }

    /* ── preview ────────────────────────────────────────────── */

    .preview-body {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--line-bright);
      color: var(--muted);
      max-width: 56ch;
    }

    .preview-body h2, .preview-body h3 {
      color: var(--ink);
      font-size: 19px;
      font-weight: 600;
      margin: 26px 0 9px;
      letter-spacing: -0.02em;
      max-width: none;
    }

    .preview-body h3 { font-size: 16.5px; }
    .preview-body p { margin-bottom: 13px; }
    .preview-body > h2:first-child { margin-top: 0; }

    /* ── list ───────────────────────────────────────────────── */

    ul.plain { list-style: none; margin-top: 22px; }

    ul.plain li {
      padding: 14px 0 14px 22px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      position: relative;
      max-width: 52ch;
    }

    ul.plain li::before {
      content: "";
      position: absolute;
      left: 0; top: 27px; /* centred on the first line, not above it */
      width: 7px; height: 1px;
      background: var(--gold);
    }

    /* ── faq ────────────────────────────────────────────────── */

    .faq-item { padding: 19px 0; border-bottom: 1px solid var(--line); }
    .faq-q { font-weight: 600; letter-spacing: -0.012em; }
    .faq-a { margin-top: 7px; color: var(--muted); font-size: 15px; max-width: 52ch; }

    /* ── footer ─────────────────────────────────────────────── */

    footer { margin-top: clamp(60px, 11vh, 96px); padding-bottom: 36px; }

    .foot {
      border-top: 1px solid var(--line-bright);
      padding-top: 17px;
      font-size: 11.5px;
      letter-spacing: 0.04em;
      color: var(--faint);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .foot a { text-decoration: none; transition: color 0.2s ease; }
    .foot a:hover, .foot a:focus-visible { color: var(--gold); }

    /* ── entrance ───────────────────────────────────────────── */

    @media (prefers-reduced-motion: no-preference) {
      .rise { opacity: 0; transform: translateY(11px); animation: rise 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
      header .rise:nth-child(1) { animation-delay: 0s; }
      header .rise:nth-child(2) { animation-delay: 0.06s; }
      header .rise:nth-child(3) { animation-delay: 0.12s; }
      header .rise:nth-child(4) { animation-delay: 0.18s; }
      header .rise:nth-child(5) { animation-delay: 0.24s; }
      header .rise:nth-child(6) { animation-delay: 0.30s; }
      @keyframes rise { to { opacity: 1; transform: none; } }
    }
  </style>
</head>

  <script type="module">
    // ═══════════════════════════════════════════════════════════
    //  EDITABLE COPY — change here, no hunting through markup.
    // ═══════════════════════════════════════════════════════════
    const copy = {
      eyebrow: 'A course by d1fpc3',
      name:    'Echelon',
      promise: 'Stop trading the whole session. Trade the ninety minutes that pay.',
      subhead: 'How I trade NQ: three windows, four setups, and a risk rule that stops a bad week becoming a bad year. The same work that produced twelve indicators and the journal I use every day.',

      price:      '$200',
      priceTerms: 'once. Yours for good.',

      forTitle: 'For the trader who already knows enough.',
      forList: [
        'You have watched more content than you can count and still do not have a plan written down.',
        'You can call the move after it happens, and hesitate at the moment it actually matters.',
        'Your winners are fine. It is the size of your losers keeping you flat.',
        'You are tired of strategies that work until the session they do not.',
      ],

      insideTitle: 'Five modules. No filler.',
      insideBody:  'The outline below is the course itself, read live as you load this page. Front to back it is under four hours, because it is a method, not a library you will never finish.',

      comingTitle: 'The D1 Engine indicator is on its way.',
      comingBody:  'The setups in this course marked on the chart for you: the windows, the sweeps, and the four playbook entries. It is the tool I have been building alongside everything else on my TradingView profile.',
      comingNote:  'Not released yet. Everyone who buys Echelon gets it free when it ships.',

      discordTitle: 'Not ready to buy? Start in the Discord.',
      discordBody:  'The next session’s economic calendar every evening, my notes on the windows, and a room where people post the trades they actually took. No pitch bot, no upsell.',
      discordTerms: 'No card, nothing to cancel.',

      faq: [
        { q: 'Do I need a big account?',
          a: 'No. The risk module is built on sizing off the stop, which works identically at one micro and at ten.' },
        { q: 'Is this just ICT with different words?',
          a: 'It shares the vocabulary — liquidity, order blocks, fair value gaps. Where it differs is that every concept here is tied to a specific window and a specific invalidation, so you know when you do not have a trade.' },
        { q: 'How long does it take?',
          a: 'Under four hours to watch. A few weeks to actually run it, because the review loop in the last module is where it starts working.' },
        { q: 'What if it is not for me?',
          a: 'REPLACE: state your actual refund policy here. Do not leave this vague.' },
        { q: 'How do I get in after I buy?',
          a: 'You land straight in the course the moment you pay. Coming back later, you sign in with your email and we send you a link.' },
      ],

      closeTitle: 'The setups are not the hard part.',
      closeBody:  'Knowing when not to trade is. That is most of what is in here, and it is the part nobody sells you.',
    }

    // ═══════════════════════════════════════════════════════════
    //  The Stripe Payment Link. Create a $200 one-time product,
    //  set its confirmation page to
    //    https://d1fpc3.com/echelon/welcome/?session_id={CHECKOUT_SESSION_ID}
    //  and paste the link URL here. Until it is set, the buy
    //  buttons say so rather than silently going nowhere.
    // ═══════════════════════════════════════════════════════════
    const PAYMENT_LINK = ''

    // ═══════════════════════════════════════════════════════════
    //  The free Discord invite. Use a permanent, non-expiring
    //  invite — Discord defaults to 7 days, which would quietly
    //  turn this into a dead link a week after launch. Left blank,
    //  the section stays hidden rather than shipping a button
    //  that goes nowhere.
    // ═══════════════════════════════════════════════════════════
    const DISCORD_INVITE = ''

    const SUPABASE_URL = 'https://cqdignbleethroyxxvzr.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_bUU5exrU1uS4FKw_Dxnp-w_-dNjAo8x'

    // ── copy into the page ──────────────────────────────────
    const set = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text }

    set('eyebrow', copy.eyebrow)
    set('name', copy.name)
    set('promise', copy.promise)
    set('subhead', copy.subhead)
    set('for-title', copy.forTitle)
    set('inside-title', copy.insideTitle)
    set('inside-body', copy.insideBody)
    set('coming-title', copy.comingTitle)
    set('coming-body', copy.comingBody)
    set('coming-note', copy.comingNote)
    set('discord-title', copy.discordTitle)
    set('discord-body', copy.discordBody)
    set('discord-terms', copy.discordTerms)
    set('close-title', copy.closeTitle)
    set('close-body', copy.closeBody)
    set('price-top', copy.price)
    set('price-bottom', copy.price)
    set('price-terms', copy.priceTerms)
    set('price-terms-2', copy.priceTerms)

    const forList = document.getElementById('for-list')
    for (const item of copy.forList) {
      const li = document.createElement('li')
      li.textContent = item
      forList.appendChild(li)
    }

    const faqList = document.getElementById('faq-list')
    for (const { q, a } of copy.faq) {
      const item = document.createElement('div')
      item.className = 'faq-item'
      const qEl = document.createElement('p')
      qEl.className = 'faq-q'
      qEl.textContent = q
      const aEl = document.createElement('p')
      aEl.className = 'faq-a'
      aEl.textContent = a
      item.append(qEl, aEl)
      faqList.appendChild(item)
    }

    if (DISCORD_INVITE) {
      document.getElementById('discord-cta').href = DISCORD_INVITE
      document.getElementById('discord').hidden = false
      const footLink = document.getElementById('foot-discord')
      footLink.href = DISCORD_INVITE
      footLink.hidden = false
      document.getElementById('foot-discord-sep').hidden = false
    }

    for (const id of ['cta-top', 'cta-bottom']) {
      const btn = document.getElementById(id)
      if (PAYMENT_LINK) {
        btn.href = PAYMENT_LINK
      } else {
        btn.href = '#'
        btn.setAttribute('aria-disabled', 'true')
        btn.textContent = 'Checkout not connected yet'
        btn.addEventListener('click', (e) => e.preventDefault())
      }
    }

    // ── curriculum, live from the database ──────────────────
    // Reads the public `curriculum` view: titles and runtimes only.
    // Bodies, video ids and file paths are not exposed to this page.
    const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`

    function runtime(secs) {
      if (!secs) return null
      const m = Math.round(secs / 60)
      return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`
    }

    function renderStats({ modules, lessons, seconds }) {
      const host = document.getElementById('stats')
      host.textContent = ''
      const cells = [
        [String(modules), 'Modules'],
        [String(lessons), 'Lessons'],
        [runtime(seconds) ?? '—', 'Runtime'],
        ['Lifetime', 'Access'],
      ]
      for (const [n, l] of cells) {
        const cell = document.createElement('div')
        cell.className = 'stat'
        const num = document.createElement('div')
        num.className = 'stat-n'
        num.textContent = n
        const lab = document.createElement('div')
        lab.className = 'stat-l'
        lab.textContent = l
        cell.append(num, lab)
        host.appendChild(cell)
      }
    }

    function renderCurriculum(rows) {
      const host = document.getElementById('curriculum')
      host.textContent = ''

      if (!rows.length) {
        host.innerHTML = '<p class="curriculum-error">Outline coming shortly.</p>'
        return
      }

      const modules = new Map()
      for (const r of rows) {
        if (!modules.has(r.module_slug)) {
          modules.set(r.module_slug, { title: r.module_title, summary: r.module_summary, lessons: [] })
        }
        modules.get(r.module_slug).lessons.push(r)
      }

      let n = 0
      for (const mod of modules.values()) {
        const wrap = document.createElement('div')
        wrap.className = 'module'

        const head = document.createElement('div')
        head.className = 'module-head'
        const title = document.createElement('span')
        title.className = 'module-title'
        title.textContent = mod.title
        const count = document.createElement('span')
        count.className = 'module-count'
        count.textContent = plural(mod.lessons.length, 'lesson')
        head.append(title, count)
        wrap.appendChild(head)

        if (mod.summary) {
          const s = document.createElement('p')
          s.className = 'module-summary'
          s.textContent = mod.summary
          wrap.appendChild(s)
        }

        for (const l of mod.lessons) {
          n += 1
          const row = document.createElement('div')
          row.className = 'lesson'

          const num = document.createElement('span')
          num.className = 'lesson-num'
          num.textContent = String(n).padStart(2, '0')

          const t = document.createElement('span')
          t.className = 'lesson-title'
          t.textContent = l.lesson_title

          row.append(num, t)

          if (l.is_preview) {
            const free = document.createElement('span')
            free.className = 'free'
            free.textContent = 'Free'
            row.appendChild(free)
          }

          const meta = document.createElement('span')
          meta.className = 'lesson-meta'
          meta.textContent = runtime(l.duration_secs) ?? l.kind
          row.appendChild(meta)

          wrap.appendChild(row)
        }

        host.appendChild(wrap)
      }

      const total = document.createElement('p')
      total.className = 'curriculum-total'
      total.textContent = `${plural(modules.size, 'module')}, ${plural(n, 'lesson')}. Yours the moment you buy.`
      host.appendChild(total)

      renderStats({
        modules: modules.size,
        lessons: n,
        seconds: rows.reduce((sum, r) => sum + (r.duration_secs ?? 0), 0),
      })
    }

    // ── the free preview lesson, in full ────────────────────
    // Readable by anon because RLS lets preview rows through.
    function renderPreview(lesson) {
      if (!lesson?.body_md) return
      document.getElementById('preview').hidden = false
      document.getElementById('preview-title').textContent = lesson.title

      // Deliberately minimal: headings and paragraphs, escaped. This renders
      // your own lesson text, but it renders it as text, not as markup.
      const host = document.getElementById('preview-body')
      for (const block of lesson.body_md.split(/\n{2,}/)) {
        const trimmed = block.trim()
        if (!trimmed) continue
        const heading = trimmed.match(/^(#{2,3})\s+(.*)$/)
        const el = document.createElement(heading ? (heading[1].length === 2 ? 'h2' : 'h3') : 'p')
        el.textContent = heading ? heading[2] : trimmed
        host.appendChild(el)
      }
    }

    async function rest(path) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
      })
      if (!res.ok) throw new Error(`${res.status}`)
      return res.json()
    }

    try {
      const [rows, previews] = await Promise.all([
        rest('curriculum?select=*&order=module_position.asc,lesson_position.asc'),
        rest('lessons?select=title,body_md&is_preview=eq.true&kind=eq.written&limit=1'),
      ])
      renderCurriculum(rows)
      renderPreview(previews[0])
    } catch (err) {
      console.error('curriculum load failed', err)
      document.getElementById('curriculum').innerHTML =
        '<p class="curriculum-error">Outline coming shortly.</p>'
      renderStats({ modules: 5, lessons: 18, seconds: 0 })
    }
  </script>
</body>
</html>
