<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <!-- zoom-lock: the page is an app, not a document. The meta stops pinch in WKWebView and Chromium; Safari ignores it, so the gesture guard below does the same job there. touch-action: manipulation removes double-tap zoom everywhere. -->
  <style>html{touch-action:manipulation;-webkit-text-size-adjust:100%}</style>
  <script>(function(){var p=function(e){e.preventDefault()};['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,p,{passive:false})});document.addEventListener('touchmove',function(e){if(typeof e.scale==='number'&&e.scale!==1)p(e)},{passive:false});window.__zoomLock=true})()</script>
