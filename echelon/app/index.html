<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Echelon</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0908">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340..680&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    /* ─────────────────────────────────────────────────────────
       d1fpc3.com | echelon — members area

       Same language as the landing page at the site root: warm
       near-black, Fraunces for the display moments, champagne
       foil as the one metal, hairlines everywhere else.

       The gate is not here: the browser only ever sees what RLS
       hands it, and video and files arrive as short-lived signed
       URLs from an edge function. Hiding a lesson in the UI is
       presentation, not protection.
       ───────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0908; --panel-2: #16130f;
      --ink: #f2ede3; --muted: #968d7e; --faint: #635c50;
      --line: rgba(242,237,227,0.09); --line-2: rgba(242,237,227,0.16);
      --gold: #c9a24a; --gold-bright: #e6cf95; --gold-deep: #a8842c;
      --foil: linear-gradient(135deg, #6f5620 0%, #c9a24a 26%, #f3e3b6 47%, #fff6df 53%, #c9a24a 74%, #6f5620 100%);
    }

    html { height: 100%; }

    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(120% 80% at 78% -10%, rgba(201,162,74,0.06), transparent 55%);
    }

    .label {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 11px; font-weight: 500; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--faint);
    }

    .btn {
      display: inline-block; padding: 14px 26px;
      background: var(--foil); background-size: 200% 100%; color: #1a1305;
      font-size: 14px; font-weight: 600; text-decoration: none;
      border: 0; border-radius: 3px; cursor: pointer;
      font-family: inherit;
      box-shadow: 0 10px 34px -12px rgba(201,162,74,0.5);
      transition: transform 0.16s ease, background 0.2s ease, box-shadow 0.24s ease;
    }
    .btn:hover, .btn:focus-visible { transform: translateY(-1px); background-position: 100% 0; }
    .btn:disabled { opacity: 0.5; cursor: default; transform: none; }
    @media (prefers-reduced-motion: reduce) { .btn:hover { transform: none; } }

    .quiet {
      background: none; border: none; padding: 0; cursor: pointer;
      font-family: inherit; font-size: 13px; color: var(--faint);
      text-decoration: none; border-bottom: 1px solid var(--line-2);
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .quiet:hover, .quiet:focus-visible { color: var(--gold-bright); border-bottom-color: var(--gold); }

    /* ── centred states: signing in, no access ──────────────── */
    /* The buy-panel object from the landing page: near-black panel,
       hairline border, one champagne edge along the top. */

    .centre {
      min-height: 100dvh; display: flex; align-items: center;
      justify-content: center; padding: 32px 24px; position: relative;
    }

    .panel {
      position: relative;
      width: 100%; max-width: 420px;
      background: linear-gradient(180deg, var(--panel-2), #080706);
      border: 1px solid var(--line-2);
      border-radius: 16px;
      padding: 34px 30px;
      box-shadow: 0 50px 90px -50px rgba(0,0,0,0.9);
    }
    .panel::before { content: ""; display: block; height: 1px; background: var(--foil); opacity: 0.6; margin: -34px -30px 30px; }

    .panel h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500; font-size: 28px;
      line-height: 1.1; letter-spacing: -0.02em;
    }
    .panel .body { margin-top: 8px; font-size: 13.5px; color: var(--muted); }
    .panel .eyebrow { color: var(--gold); margin-bottom: 12px; }

    form.signin { margin-top: 20px; }

    /* floating-label field: underlined, no filled box */
    .fld { position: relative; margin-bottom: 16px; }

    .fld input {
      width: 100%;
      padding: 19px 0 9px;
      font-family: inherit; font-size: 14.5px;
      color: var(--ink);
      background: transparent;
      border: 0; border-bottom: 1px solid var(--line-2);
      border-radius: 0;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .fld input:focus { border-bottom-color: var(--gold); }

    .fld label {
      position: absolute;
      left: 0; top: 15px;
      font-size: 13.5px;
      color: var(--faint);
      pointer-events: none;
      transform-origin: left top;
      transition: transform 0.18s ease, color 0.18s ease;
    }
    .fld input:focus + label,
    .fld input:not(:placeholder-shown) + label {
      transform: translateY(-13px) scale(0.72);
      color: var(--muted);
    }

    .go {
      width: 100%;
      margin: 10px 0 4px;
      padding: 15px;
      border: none; border-radius: 3px;
      background: var(--foil); background-size: 200% 100%; color: #1a1305;
      font: 600 14.5px/1 inherit;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 10px 34px -12px rgba(201,162,74,0.5);
      transition: transform 0.16s ease, background 0.2s ease, box-shadow 0.24s ease, opacity 0.2s ease;
    }
    .go:hover:not(:disabled) { transform: translateY(-1px); background-position: 100% 0; box-shadow: 0 14px 40px -12px rgba(201,162,74,0.62); }
    .go:disabled { opacity: 0.6; cursor: default; }
    @media (prefers-reduced-motion: reduce) { .go:hover:not(:disabled) { transform: none; } }

    .or {
      display: flex; align-items: center; gap: 10px;
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--faint);
      margin: 18px 0 12px;
    }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }

    .alt { display: grid; gap: 9px; }

    .alt button {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      padding: 13px;
      border: 1px solid var(--line-2);
      border-radius: 3px;
      background: transparent;
      color: var(--ink);
      font: 600 13px/1 inherit;
      font-family: inherit;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .alt button:hover { border-color: var(--gold); color: var(--gold-bright); }
    .alt button svg { width: 16px; height: 16px; }

    .form-note { font-size: 12.5px; color: var(--faint); margin-top: 10px; }
    .form-error { font-size: 12.5px; color: #e0a08d; margin-top: 10px; }

    /* ── app shell ──────────────────────────────────────────── */

    .shell { display: none; }
    .shell.on { display: block; }

    .topbar {
      border-bottom: 1px solid var(--line);
      padding: 16px clamp(20px, 5vw, 40px);
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
    }
    .brand {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 13px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase;
    }
    .who { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 14px; }

    .layout {
      max-width: 1060px; margin: 0 auto;
      padding: clamp(24px, 5vh, 44px) clamp(20px, 5vw, 40px) 80px;
      display: grid; grid-template-columns: 268px 1fr; gap: clamp(28px, 5vw, 56px);
      align-items: start;
    }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; gap: 30px; }
    }

    /* ── lesson index: table-of-contents rail ───────────────── */
    /* Continuous hairline down the left, the active item marked by a
       solid bar sitting on top of it. Recoloured for the dark shell. */

    .toc { position: sticky; top: 26px; }
    @media (max-width: 800px) { .toc { position: static; } }

    .toc-group + .toc-group { margin-top: 24px; }

    .toc .cap {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 10.5px; font-weight: 500; line-height: 1;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 10px;
      padding-left: 14px;
    }

    .toc button {
      position: relative;
      display: block;
      width: 100%;
      text-align: left;
      padding: 8px 22px 8px 14px;
      font-family: inherit;
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--muted);
      background: none;
      border: 0;
      border-left: 1.5px solid var(--line);
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .toc button:hover { color: var(--ink); }
    .toc button.on { color: var(--gold); font-weight: 600; }

    .toc button.on::before {
      content: "";
      position: absolute;
      left: -1.5px;
      top: 6px; bottom: 6px;
      width: 1.5px;
      background: var(--gold);
    }

    .toc button:focus-visible { outline: 1px solid var(--gold); outline-offset: -2px; }

    /* progress, kept but quietened to a dot so it does not fight the rail */
    .toc .done {
      position: absolute; right: 4px; top: 50%;
      transform: translateY(-50%);
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--gold); opacity: 0.5;
    }

    /* ── lesson body ────────────────────────────────────────── */

    .lesson-kind { color: var(--gold); }
    .lesson-h {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500; font-size: clamp(26px, 5vw, 36px);
      line-height: 1.08; letter-spacing: -0.02em; margin-top: 12px;
    }
    .lesson-sum { margin-top: 12px; color: var(--muted); max-width: 56ch; }

    .player {
      margin-top: 26px; position: relative; width: 100%;
      aspect-ratio: 16 / 9; border: 1px solid var(--line); background: #000;
    }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    .prose { margin-top: 26px; max-width: 62ch; color: var(--muted); }
    .prose h2, .prose h3 {
      font-family: 'Fraunces', Georgia, serif;
      color: var(--ink); font-weight: 500; letter-spacing: -0.015em;
      margin: 26px 0 10px; font-size: 21px;
    }
    .prose h3 { font-size: 17px; }
    .prose p { margin-bottom: 14px; }

    .notice {
      margin-top: 26px; padding: 16px 0; border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line); color: var(--faint); font-size: 14px;
    }

    .lesson-foot {
      margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    }

    .empty { color: var(--faint); }
  </style>
</head>
<body>

  <!-- signing in / no access -->
  <div class="centre" id="gate">
    <div class="panel" id="gate-panel">
      <p class="label eyebrow" id="gate-label">Echelon</p>
      <h1 id="gate-title">Loading…</h1>
      <p class="body" id="gate-body"></p>
      <div id="gate-actions"></div>
    </div>
  </div>

  <!-- the course -->
  <div class="shell" id="shell">
    <div class="topbar">
      <span class="brand">Echelon</span>
      <span class="who">
        <span id="who-email"></span>
        <a class="quiet" id="discord-link" href="#" target="_blank" rel="noopener" hidden>Discord</a>
        <button class="quiet" id="signout">Sign out</button>
      </span>
    </div>
    <div class="layout">
      <nav class="toc" id="index" aria-label="Lessons"></nav>
      <main id="lesson"></main>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const SUPABASE_URL = 'https://cqdignbleethroyxxvzr.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_bUU5exrU1uS4FKw_Dxnp-w_-dNjAo8x'

    // Keep this the same permanent invite used on the sales page. Blank hides
    // the link rather than shipping a button that goes nowhere.
    const DISCORD_INVITE = ''

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)
    const el = (id) => document.getElementById(id)

    const state = { user: null, isAdmin: false, modules: [], lessons: [], done: new Set(), currentId: null }

    // ── gate rendering ──────────────────────────────────────

    function gate({ title, body, render }) {
      el('shell').classList.remove('on')
      el('gate').style.display = 'flex'
      el('gate-title').textContent = title
      el('gate-body').textContent = body ?? ''
      const host = el('gate-actions')
      host.textContent = ''
      render?.(host)
    }

    const DISCORD_MARK = 'M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.249a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.036A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.891.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.056c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.029ZM8.02 15.331c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.211 0 2.176 1.096 2.157 2.42 0 1.332-.955 2.418-2.157 2.418Zm7.975 0c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.211 0 2.176 1.096 2.157 2.42 0 1.332-.946 2.418-2.157 2.418Z'

    function discordButton(onError) {
      const btn = document.createElement('button')
      btn.type = 'button'
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg')
      svg.setAttribute('viewBox', '0 0 24 24')
      svg.setAttribute('fill', 'currentColor')
      svg.setAttribute('aria-hidden', 'true')
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path')
      path.setAttribute('d', DISCORD_MARK)
      svg.appendChild(path)
      btn.append(svg, document.createTextNode('Discord'))

      btn.addEventListener('click', async () => {
        btn.disabled = true
        // guilds.join is what lets us drop a buyer into the server with their
        // paid role already on, instead of handing them an invite link.
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'discord',
          options: {
            redirectTo: 'https://d1fpc3.com/echelon/app/',
            scopes: 'identify email guilds.join',
          },
        })
        if (error) {
          btn.disabled = false
          onError(
            /provider is not enabled/i.test(error.message)
              ? 'Discord sign-in is not switched on yet. Use your email for now.'
              : error.message,
          )
        }
      })
      return btn
    }

    function signInScreen(message) {
      gate({
        title: 'Welcome back',
        body: 'Sign in with the email you bought with. No password to remember.',
        render(host) {
          const form = document.createElement('form')
          form.className = 'signin'

          const field = document.createElement('div')
          field.className = 'fld'
          const input = document.createElement('input')
          input.type = 'email'
          input.id = 'signin-email'
          input.placeholder = ' '        // the floating label depends on :placeholder-shown
          input.autocomplete = 'email'
          input.required = true
          const label = document.createElement('label')
          label.setAttribute('for', 'signin-email')
          label.textContent = 'Email'
          field.append(input, label)

          const button = document.createElement('button')
          button.type = 'submit'
          button.className = 'go'
          button.textContent = 'Send me a sign-in link'

          const note = document.createElement('p')
          note.className = message ? 'form-error' : 'form-note'
          note.textContent = message ?? ''

          const fail = (text) => { note.className = 'form-error'; note.textContent = text }

          const or = document.createElement('div')
          or.className = 'or'
          or.textContent = 'or continue with'

          const alt = document.createElement('div')
          alt.className = 'alt'
          alt.appendChild(discordButton(fail))

          form.append(field, button, note, or, alt)
          host.appendChild(form)

          form.addEventListener('submit', async (e) => {
            e.preventDefault()
            button.disabled = true
            button.textContent = 'Sending…'
            const { error } = await supabase.auth.signInWithOtp({
              email: input.value.trim(),
              options: { emailRedirectTo: 'https://d1fpc3.com/echelon/app/' },
            })
            if (error) {
              fail(error.message)
              button.disabled = false
              button.textContent = 'Send me a sign-in link'
              return
            }
            gate({
              title: 'Check your email.',
              body: `We sent a sign-in link to ${input.value.trim()}. It works once, and it expires in an hour.`,
            })
          })
        },
      })
    }

    function noAccessScreen(email) {
      gate({
        title: 'No access on this email.',
        body: `${email} has not bought Echelon. If you paid with a different address, sign in with that one instead.`,
        render(host) {
          const buy = document.createElement('a')
          buy.className = 'btn'
          buy.href = '/'
          buy.textContent = 'See what Echelon is'

          const other = document.createElement('button')
          other.className = 'quiet'
          other.textContent = 'Use a different email'
          other.style.marginTop = '18px'
          other.style.display = 'block'
          other.addEventListener('click', async () => {
            await supabase.auth.signOut()
            signInScreen()
          })

          host.append(buy, other)
        },
      })
    }

    // ── content ─────────────────────────────────────────────

    const KIND_LABEL = { video: 'Video', written: 'Read', download: 'Download', live: 'Live' }

    function renderIndex() {
      const host = el('index')
      host.textContent = ''

      for (const mod of state.modules) {
        const lessons = state.lessons.filter((l) => l.module_id === mod.id)
        if (!lessons.length) continue

        const group = document.createElement('div')
        group.className = 'toc-group'

        const cap = document.createElement('div')
        cap.className = 'cap'
        cap.textContent = mod.title
        group.appendChild(cap)

        for (const lesson of lessons) {
          const btn = document.createElement('button')
          btn.type = 'button'
          const current = lesson.id === state.currentId
          if (current) {
            btn.className = 'on'
            btn.setAttribute('aria-current', 'true')
          }
          btn.textContent = lesson.title

          if (state.done.has(lesson.id)) {
            const dot = document.createElement('span')
            dot.className = 'done'
            dot.title = 'Completed'
            btn.appendChild(dot)
          }

          btn.addEventListener('click', () => openLesson(lesson.id))
          group.appendChild(btn)
        }

        host.appendChild(group)
      }
    }

    /** Minimal and deliberately text-only: headings and paragraphs, escaped. */
    function renderProse(host, md) {
      for (const block of md.split(/\n{2,}/)) {
        const trimmed = block.trim()
        if (!trimmed) continue
        const heading = trimmed.match(/^(#{2,3})\s+(.*)$/)
        const node = document.createElement(heading ? (heading[1].length === 2 ? 'h2' : 'h3') : 'p')
        node.textContent = heading ? heading[2] : trimmed
        host.appendChild(node)
      }
    }

    async function signedMedia(lessonId) {
      const { data: { session } } = await supabase.auth.getSession()
      const res = await fetch(`${SUPABASE_URL}/functions/v1/media-url`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${session?.access_token ?? ''}`,
        },
        body: JSON.stringify({ lesson_id: lessonId }),
      })
      const payload = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(payload.error ?? `${res.status}`)
      return payload
    }

    async function openLesson(id) {
      state.currentId = id
      renderIndex()

      const lesson = state.lessons.find((l) => l.id === id)
      const host = el('lesson')
      host.textContent = ''
      if (!lesson) return

      const kind = document.createElement('p')
      kind.className = 'label lesson-kind'
      kind.textContent = KIND_LABEL[lesson.kind] ?? lesson.kind
      host.appendChild(kind)

      const h = document.createElement('h1')
      h.className = 'lesson-h'
      h.textContent = lesson.title
      host.appendChild(h)

      if (lesson.summary) {
        const s = document.createElement('p')
        s.className = 'lesson-sum'
        s.textContent = lesson.summary
        host.appendChild(s)
      }

      if (lesson.kind === 'video') {
        const player = document.createElement('div')
        player.className = 'player'
        host.appendChild(player)
        try {
          const { url } = await signedMedia(lesson.id)
          const frame = document.createElement('iframe')
          frame.src = url
          frame.allow = 'accelerometer; gyroscope; encrypted-media; picture-in-picture; fullscreen'
          frame.allowFullscreen = true
          frame.loading = 'lazy'
          player.appendChild(frame)
        } catch (err) {
          player.remove()
          const notice = document.createElement('p')
          notice.className = 'notice'
          notice.textContent = `This video is not playable yet (${err.message}).`
          host.appendChild(notice)
        }
      }

      if (lesson.kind === 'download') {
        const notice = document.createElement('div')
        notice.className = 'lesson-foot'
        const btn = document.createElement('button')
        btn.className = 'btn'
        btn.textContent = 'Download'
        btn.addEventListener('click', async () => {
          btn.disabled = true
          btn.textContent = 'Preparing…'
          try {
            const { url } = await signedMedia(lesson.id)
            location.href = url
            btn.textContent = 'Download'
          } catch (err) {
            btn.textContent = `Not available (${err.message})`
          } finally {
            btn.disabled = false
          }
        })
        notice.appendChild(btn)
        host.appendChild(notice)
      }

      if (lesson.kind === 'live') {
        const notice = document.createElement('p')
        notice.className = 'notice'
        notice.textContent = 'Live session. Details are sent by email ahead of each one.'
        host.appendChild(notice)
      }

      if (lesson.body_md) {
        const prose = document.createElement('div')
        prose.className = 'prose'
        renderProse(prose, lesson.body_md)
        host.appendChild(prose)
      }

      // ── mark complete / next ──
      const foot = document.createElement('div')
      foot.className = 'lesson-foot'

      const done = state.done.has(lesson.id)
      const mark = document.createElement('button')
      mark.className = done ? 'quiet' : 'btn'
      mark.textContent = done ? 'Mark as not done' : 'Mark complete'
      mark.addEventListener('click', async () => {
        mark.disabled = true
        const nowDone = !state.done.has(lesson.id)
        const { error } = await supabase.from('progress').upsert({
          user_id: state.user.id,
          lesson_id: lesson.id,
          completed_at: nowDone ? new Date().toISOString() : null,
        }, { onConflict: 'user_id,lesson_id' })
        if (!error) {
          nowDone ? state.done.add(lesson.id) : state.done.delete(lesson.id)
          openLesson(lesson.id)
        } else {
          mark.disabled = false
          mark.textContent = 'Could not save'
        }
      })
      foot.appendChild(mark)

      const ordered = state.modules.flatMap((m) => state.lessons.filter((l) => l.module_id === m.id))
      const at = ordered.findIndex((l) => l.id === lesson.id)
      const next = ordered[at + 1]
      if (next) {
        const nextBtn = document.createElement('button')
        nextBtn.className = 'quiet'
        nextBtn.textContent = `Next: ${next.title}`
        nextBtn.addEventListener('click', () => {
          openLesson(next.id)
          window.scrollTo({ top: 0, behavior: 'smooth' })
        })
        foot.appendChild(nextBtn)
      }

      host.appendChild(foot)
    }

    async function loadCourse() {
      // These come back filtered by RLS: without an active entitlement the
      // modules query is simply empty. The explicit entitlement check below is
      // for the message, not the gate.
      const [{ data: modules }, { data: lessons }, { data: progress }] = await Promise.all([
        supabase.from('modules').select('id, title, position').order('position'),
        supabase.from('lessons').select('id, module_id, title, summary, kind, body_md, position').order('position'),
        supabase.from('progress').select('lesson_id, completed_at'),
      ])

      state.modules = modules ?? []
      state.lessons = lessons ?? []
      state.done = new Set((progress ?? []).filter((p) => p.completed_at).map((p) => p.lesson_id))

      el('gate').style.display = 'none'
      el('shell').classList.add('on')
      el('who-email').textContent = state.user.email

      if (DISCORD_INVITE) {
        const link = el('discord-link')
        link.href = DISCORD_INVITE
        link.hidden = false
      }

      renderIndex()
      const first = state.modules
        .flatMap((m) => state.lessons.filter((l) => l.module_id === m.id))[0]
      if (first) {
        openLesson(first.id)
      } else {
        el('lesson').innerHTML = '<p class="empty">No lessons published yet.</p>'
      }
    }

    // ── boot ────────────────────────────────────────────────

    el('signout').addEventListener('click', async () => {
      await supabase.auth.signOut()
      location.reload()
    })

    async function boot() {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session) return signInScreen()

      state.user = session.user

      // Paid, or runs the place. Admins get in without a purchase row so the
      // owner never has to fake a sale to look at their own course.
      const [{ data: ent }, { data: isAdmin }] = await Promise.all([
        supabase.from('entitlements').select('status').eq('status', 'active').maybeSingle(),
        supabase.rpc('is_admin'),
      ])

      if (!ent && !isAdmin) return noAccessScreen(session.user.email)
      state.isAdmin = !!isAdmin
      await loadCourse()
    }

    // Magic-link returns land here with tokens in the URL fragment;
    // supabase-js consumes them, then fires SIGNED_IN.
    supabase.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_IN' && !state.user) boot()
    })

    boot()
  </script>
</body>
</html>
