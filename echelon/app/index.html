<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Echelon</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0a09">
  <style>
    /* ─────────────────────────────────────────────────────────
       d1fpc3.com | echelon — members area

       Same shell as the admin dashboard, deliberately: fixed
       sidebar with tabs, the signed-in user pinned bottom-left,
       a content pane that swaps per tab.

       The gate is not here: the browser only ever sees what RLS
       hands it, and video and files arrive as short-lived signed
       URLs from an edge function. Hiding a lesson in the UI is
       presentation, not protection. Nothing on this page can list
       other members — entitlement rows are RLS'd to your own.
       ───────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0b0a09;
      --panel: #131211;
      --panel-2: #1a1817;
      --ink: #f4f2ee;
      --muted: #9d978c;
      --faint: #6b665e;
      --line: #262321;
      --line-bright: #383431;
      --gold: #c9a24a;
      --gold-deep: #a8842c;
      --bad: #d98b7a;
      --good: #86b57f;
      --sidebar: 244px;
    }

    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px; line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    .label { font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--faint); }

    /* ════ GATE (glass card) ═════════════════════════════════ */

    .centre {
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 32px 24px; position: relative;
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(66px); opacity: 0.5; pointer-events: none; }
    .o1 { width: 320px; height: 320px; background: #a8842c; top: 10%; left: 50%; margin-left: -290px;
          animation: gl-drift 9s ease-in-out infinite alternate; }
    .o2 { width: 280px; height: 280px; background: #7a4f16; bottom: 12%; left: 50%; margin-left: 40px;
          animation: gl-drift 11s ease-in-out infinite alternate-reverse; }
    @keyframes gl-drift { to { transform: translate(30px, 24px) scale(1.14); } }
    @media (prefers-reduced-motion: reduce) { .orb { animation: none; } }

    .glass {
      position: relative; width: 100%; max-width: 380px;
      background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 20px; padding: 28px 24px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 24px 60px -24px rgba(0,0,0,0.7);
    }
    .glass h1 { font-size: 24px; font-weight: 650; letter-spacing: -0.025em; }
    .glass .body { margin-top: 6px; font-size: 13px; color: rgba(255,255,255,0.55); }
    .glass .label { color: var(--gold); margin-bottom: 12px; }

    .fld { position: relative; margin-bottom: 12px; }
    .fld input {
      width: 100%; padding: 19px 14px 8px; font-family: inherit; font-size: 14.5px; color: #fff;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 11px; outline: none; transition: border-color 0.2s ease, background 0.2s ease;
    }
    .fld input:focus { border-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.1); }
    .fld label {
      position: absolute; left: 15px; top: 15px; font-size: 13.5px; color: rgba(255,255,255,0.45);
      pointer-events: none; transform-origin: left top; transition: transform 0.18s ease, color 0.18s ease;
    }
    .fld input:focus + label, .fld input:not(:placeholder-shown) + label {
      transform: translateY(-9px) scale(0.72); color: rgba(255,255,255,0.7);
    }
    .go {
      width: 100%; margin-top: 6px; padding: 14px; border: none; border-radius: 11px;
      background: #fff; color: #0a0a0a; font: 600 14.5px/1 inherit; font-family: inherit; cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.25s ease, opacity 0.2s ease;
    }
    .go:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 28px -12px rgba(255,255,255,0.45); }
    .go:disabled { opacity: 0.6; cursor: default; }
    .go.dim { background: rgba(255,255,255,0.08); color: #fff; }
    .form-note { font-size: 12.5px; color: rgba(255,255,255,0.45); margin-top: 10px; }
    .form-error { font-size: 12.5px; color: var(--bad); margin-top: 10px; }

    .or {
      display: flex; align-items: center; gap: 10px;
      font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      color: rgba(255,255,255,0.35); margin: 16px 0 12px;
    }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.12); }

    /* ════ APP SHELL (identical to admin) ════════════════════ */

    .app { display: none; min-height: 100dvh; }
    .app.on { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); }

    .side {
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100dvh;
    }

    .side-brand {
      display: flex; align-items: center; gap: 10px;
      padding: 20px 20px 18px;
      font-weight: 700; font-size: 16px; letter-spacing: -0.02em;
    }
    .side-brand .dot {
      width: 22px; height: 22px; border-radius: 7px;
      background: linear-gradient(140deg, var(--gold), var(--gold-deep));
    }
    .side-brand small {
      font-size: 9.5px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--gold); background: rgba(201,162,74,0.1);
      border: 1px solid rgba(201,162,74,0.25); border-radius: 5px; padding: 2px 6px; margin-left: auto;
    }

    .side-nav { padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }

    .side-cap { padding: 14px 8px 6px; }

    .tab {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 12px; border-radius: 8px;
      background: none; border: 0; width: 100%; text-align: left;
      font-family: inherit; font-size: 13.5px; font-weight: 500; color: var(--muted);
      cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
      text-decoration: none;
    }
    .tab:hover { background: var(--panel-2); color: var(--ink); }
    .tab.on { background: var(--panel-2); color: var(--ink); }
    .tab.on .ic { color: var(--gold); }
    .tab .ic { width: 17px; height: 17px; color: var(--faint); flex-shrink: 0; transition: color 0.15s ease; }
    .tab .count {
      margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums;
      color: var(--faint); background: var(--panel-2); border-radius: 20px; padding: 1px 8px;
    }
    .tab.on .count { background: rgba(201,162,74,0.14); color: var(--gold); }

    .side-user {
      margin-top: auto; border-top: 1px solid var(--line);
      padding: 12px; display: flex; align-items: center; gap: 11px;
    }
    .avatar {
      width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(140deg, var(--gold), var(--gold-deep));
      color: #1a1207; font-weight: 700; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .side-user .u-meta { min-width: 0; flex: 1; }
    .side-user .u-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .side-user .u-role { font-size: 11px; color: var(--faint); }
    .u-signout {
      background: none; border: 0; color: var(--faint); cursor: pointer; padding: 6px;
      border-radius: 7px; display: flex; transition: color 0.15s ease, background 0.15s ease;
    }
    .u-signout:hover { color: var(--bad); background: var(--panel-2); }
    .u-signout svg { width: 16px; height: 16px; }

    .main { min-width: 0; display: flex; flex-direction: column; }

    .topbar {
      position: sticky; top: 0; z-index: 5;
      background: rgba(11,10,9,0.82); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: 18px clamp(20px, 3vw, 34px);
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .topbar h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
    .topbar .crumb { font-size: 12.5px; color: var(--faint); margin-top: 1px; }

    .pane { padding: clamp(20px, 3vw, 34px); }
    .view { display: none; }
    .view.on { display: block; animation: fade 0.25s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
    @media (prefers-reduced-motion: reduce) { .view.on { animation: none; } }

    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
    @media (max-width: 900px) { .cards { grid-template-columns: repeat(2, 1fr); } }
    .scard {
      background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 17px 18px;
    }
    .scard .k { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); }
    .scard .v { font-size: 27px; font-weight: 700; letter-spacing: -0.02em; margin-top: 7px; font-variant-numeric: tabular-nums; }
    .scard .d { font-size: 11.5px; color: var(--faint); margin-top: 3px; }

    .block { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    .block + .block { margin-top: 20px; }
    .block-head {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 15px 18px; border-bottom: 1px solid var(--line);
    }
    .block-head h3 { font-size: 14.5px; font-weight: 650; letter-spacing: -0.01em; }

    .tbl-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 480px; }
    th {
      text-align: left; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint);
      font-weight: 500; padding: 12px 14px; background: var(--panel-2); border-bottom: 1px solid var(--line);
    }
    td { padding: 13px 14px; border-bottom: 1px solid var(--line); color: var(--muted); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: 0; }
    td.ink { color: var(--ink); font-weight: 500; }
    tbody tr { cursor: default; }
    tbody tr.rowlink { cursor: pointer; }
    tbody tr:hover td { background: rgba(255,255,255,0.014); }
    .num { font-variant-numeric: tabular-nums; }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
      border-radius: 6px; padding: 3px 8px;
    }
    .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .b-live { color: var(--good); background: rgba(134,181,127,0.12); }
    .b-draft { color: var(--faint); background: var(--panel-2); }

    .rowbtn {
      background: var(--panel-2); border: 1px solid var(--line-bright); border-radius: 7px;
      color: var(--muted); font-family: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer;
      transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease;
    }
    .rowbtn:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
    .rowbtn:disabled { opacity: 0.4; cursor: default; }

    .empty { padding: 34px 18px; text-align: center; color: var(--faint); font-size: 13.5px; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 18px; background: linear-gradient(135deg, var(--gold), var(--gold-deep));
      color: #1a1207; border: 0; border-radius: 9px;
      font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
      transition: filter 0.18s ease, transform 0.15s ease;
      text-decoration: none;
    }
    .btn:hover:not(:disabled) { filter: brightness(1.07); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: default; }

    /* ── course: toc rail + lesson pane ──────────────────────── */

    .course-grid {
      display: grid; grid-template-columns: 240px minmax(0, 1fr);
      gap: 24px; align-items: start;
    }
    @media (max-width: 860px) { .course-grid { grid-template-columns: 1fr; } }

    .toc { position: sticky; top: 92px; }
    @media (max-width: 860px) { .toc { position: static; } }
    .toc-group + .toc-group { margin-top: 20px; }
    .toc .cap { padding: 0 0 8px 14px; }
    .toc button {
      position: relative; display: block; width: 100%; text-align: left;
      padding: 7px 22px 7px 14px;
      font-family: inherit; font-size: 13px; line-height: 1.45; color: var(--muted);
      background: none; border: 0; border-left: 1.5px solid var(--line);
      cursor: pointer; transition: color 0.15s ease;
    }
    .toc button:hover { color: var(--ink); }
    .toc button.on { color: var(--gold); font-weight: 600; }
    .toc button.on::before {
      content: ""; position: absolute; left: -1.5px; top: 6px; bottom: 6px;
      width: 1.5px; background: var(--gold);
    }
    .toc button:focus-visible { outline: 1px solid var(--gold); outline-offset: -2px; }
    .toc .done {
      position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
      width: 5px; height: 5px; border-radius: 50%; background: var(--gold); opacity: 0.5;
    }

    .lesson-pane { padding: clamp(18px, 3vw, 28px); }
    .lesson-kind { color: var(--gold); }
    .lesson-h { font-size: clamp(21px, 3.5vw, 27px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-top: 10px; }
    .lesson-sum { margin-top: 10px; color: var(--muted); max-width: 58ch; font-size: 13.5px; }

    .player {
      margin-top: 22px; position: relative; width: 100%;
      aspect-ratio: 16 / 9; border: 1px solid var(--line); border-radius: 10px;
      background: #000; overflow: hidden;
    }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    .prose { margin-top: 22px; max-width: 62ch; color: var(--muted); font-size: 13.5px; line-height: 1.7; }
    .prose h2, .prose h3 { color: var(--ink); font-weight: 650; letter-spacing: -0.015em; margin: 22px 0 8px; font-size: 16.5px; }
    .prose h3 { font-size: 14.5px; }
    .prose p { margin-bottom: 12px; }

    .notice {
      margin-top: 22px; padding: 14px 0; border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line); color: var(--faint); font-size: 13px;
    }

    .lesson-foot {
      margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line);
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    }

    /* ── recap reader ────────────────────────────────────────── */

    .recap-pane { padding: clamp(18px, 3vw, 28px); }
    .recap-pane .lesson-h { margin-top: 8px; }
  </style>
</head>
<body>

  <!-- ════ GATE ════ -->
  <div class="centre" id="gate">
    <span class="orb o1" aria-hidden="true"></span>
    <span class="orb o2" aria-hidden="true"></span>
    <div class="glass">
      <p class="label" id="gate-label">Echelon</p>
      <h1 id="gate-title">One moment…</h1>
      <p class="body" id="gate-body"></p>
      <div id="gate-actions"></div>
    </div>
  </div>

  <!-- ════ DASHBOARD ════ -->
  <div class="app" id="app">
    <aside class="side">
      <div class="side-brand">
        <span class="dot" aria-hidden="true"></span>
        Echelon <small>Members</small>
      </div>

      <nav class="side-nav" id="tabs" aria-label="Sections">
        <p class="side-cap label">Overview</p>
        <button class="tab on" data-view="overview" data-title="Overview" data-crumb="Where you are">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
          Overview
        </button>

        <p class="side-cap label">Learn</p>
        <button class="tab" data-view="course" data-title="Course" data-crumb="Lessons and progress">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          Course <span class="count" id="c-lessons">—</span>
        </button>
        <button class="tab" data-view="recaps" data-title="Trade recaps" data-crumb="Session write-ups">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
          Trade recaps <span class="count" id="c-recaps">—</span>
        </button>

        <p class="side-cap label" id="more-cap" hidden>More</p>
        <a class="tab" id="discord-link" href="#" target="_blank" rel="noopener" hidden>
          <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.317 4.369a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.249a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.036A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.009c.12.099.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.891.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.056c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.029ZM8.02 15.331c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.211 0 2.176 1.096 2.157 2.42 0 1.332-.955 2.418-2.157 2.418Zm7.975 0c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.211 0 2.176 1.096 2.157 2.42 0 1.332-.946 2.418-2.157 2.418Z"/></svg>
          Discord
        </a>
        <a class="tab" id="admin-link" href="/echelon/admin/" hidden>
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Admin
        </a>
      </nav>

      <div class="side-user">
        <div class="avatar" id="u-avatar">·</div>
        <div class="u-meta">
          <div class="u-name" id="u-name">—</div>
          <div class="u-role" id="u-role">Member</div>
        </div>
        <button class="u-signout" id="signout" title="Sign out" aria-label="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </aside>

    <div class="main">
      <div class="topbar">
        <div>
          <h2 id="pane-title">Overview</h2>
          <div class="crumb" id="pane-crumb">Where you are</div>
        </div>
      </div>

      <div class="pane">
        <!-- OVERVIEW -->
        <section class="view on" id="v-overview">
          <div class="cards" id="ov-cards"></div>
          <div class="block">
            <div class="block-head"><h3>Pick up where you left off</h3></div>
            <div class="lesson-pane" id="ov-continue"></div>
          </div>
          <div class="block">
            <div class="block-head"><h3>Latest trade recap</h3></div>
            <div class="lesson-pane" id="ov-recap"><p class="empty" style="padding:0;text-align:left;">No recaps yet.</p></div>
          </div>
        </section>

        <!-- COURSE -->
        <section class="view" id="v-course">
          <div class="course-grid">
            <nav class="toc" id="index" aria-label="Lessons"></nav>
            <div class="block"><main class="lesson-pane" id="lesson"></main></div>
          </div>
        </section>

        <!-- RECAPS -->
        <section class="view" id="v-recaps">
          <div class="block" id="recap-reader-block" hidden>
            <div class="block-head"><h3 id="recap-reader-date">Recap</h3></div>
            <div class="recap-pane" id="recap-reader"></div>
          </div>
          <div class="block">
            <div class="block-head">
              <h3>All recaps</h3>
              <span class="label" id="recaps-total"></span>
            </div>
            <div class="tbl-scroll"><table id="recaps-table"></table></div>
            <div class="empty" id="recaps-empty" hidden>No recaps posted yet. They land here after each session.</div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const SUPABASE_URL = 'https://cqdignbleethroyxxvzr.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_bUU5exrU1uS4FKw_Dxnp-w_-dNjAo8x'

    // Keep this the same permanent invite used on the sales page. Blank hides
    // the link rather than shipping a button that goes nowhere.
    const DISCORD_INVITE = ''

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)
    const el = (id) => document.getElementById(id)

    const state = { user: null, isAdmin: false, modules: [], lessons: [], done: new Set(), currentId: null, recaps: [], currentRecap: null }

    const whenDay = (d) => { const [y, m, dd] = d.split('-').map(Number); return new Date(y, m - 1, dd).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) }

    // ── gate rendering ──────────────────────────────────────

    function gate({ title, body, render }) {
      el('app').classList.remove('on')
      el('gate').style.display = 'flex'
      el('gate-title').textContent = title
      el('gate-body').textContent = body ?? ''
      const host = el('gate-actions')
      host.textContent = ''
      render?.(host)
    }

    function discordButton(onError) {
      const btn = document.createElement('button')
      btn.type = 'button'
      btn.className = 'go dim'
      btn.textContent = 'Continue with Discord'
      btn.addEventListener('click', async () => {
        btn.disabled = true
        // guilds.join is what lets us drop a buyer into the server with their
        // paid role already on, instead of handing them an invite link.
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'discord',
          options: {
            redirectTo: 'https://d1fpc3.com/echelon/app/',
            scopes: 'identify email guilds.join',
          },
        })
        if (error) {
          btn.disabled = false
          onError(
            /provider is not enabled/i.test(error.message)
              ? 'Discord sign-in is not switched on yet. Use your email for now.'
              : error.message,
          )
        }
      })
      return btn
    }

    function signInScreen(message) {
      gate({
        title: 'Welcome back',
        body: 'Sign in with the email you bought with. No password to remember.',
        render(host) {
          const form = document.createElement('form')
          form.style.marginTop = '20px'

          const field = document.createElement('div')
          field.className = 'fld'
          const input = document.createElement('input')
          input.type = 'email'
          input.id = 'signin-email'
          input.placeholder = ' '        // the floating label depends on :placeholder-shown
          input.autocomplete = 'email'
          input.required = true
          const label = document.createElement('label')
          label.setAttribute('for', 'signin-email')
          label.textContent = 'Email'
          field.append(input, label)

          const button = document.createElement('button')
          button.type = 'submit'
          button.className = 'go'
          button.textContent = 'Send me a sign-in link'

          const note = document.createElement('p')
          note.className = message ? 'form-error' : 'form-note'
          note.textContent = message ?? ''

          const fail = (text) => { note.className = 'form-error'; note.textContent = text }

          const or = document.createElement('div')
          or.className = 'or'
          or.textContent = 'or'

          form.append(field, button, note, or, discordButton(fail))
          host.appendChild(form)

          form.addEventListener('submit', async (e) => {
            e.preventDefault()
            button.disabled = true
            button.textContent = 'Sending…'
            const { error } = await supabase.auth.signInWithOtp({
              email: input.value.trim(),
              options: { emailRedirectTo: 'https://d1fpc3.com/echelon/app/' },
            })
            if (error) {
              fail(error.message)
              button.disabled = false
              button.textContent = 'Send me a sign-in link'
              return
            }
            gate({
              title: 'Check your email.',
              body: `We sent a sign-in link to ${input.value.trim()}. It works once, and it expires in an hour.`,
            })
          })
        },
      })
    }

    function noAccessScreen(email) {
      gate({
        title: 'No access on this email.',
        body: `${email} has not bought Echelon. If you paid with a different address, sign in with that one instead.`,
        render(host) {
          const buy = document.createElement('a')
          buy.className = 'go'
          buy.style.display = 'block'
          buy.style.textAlign = 'center'
          buy.style.textDecoration = 'none'
          buy.style.marginTop = '20px'
          buy.href = '/'
          buy.textContent = 'See what Echelon is'

          const other = document.createElement('button')
          other.className = 'go dim'
          other.style.marginTop = '10px'
          other.textContent = 'Use a different email'
          other.addEventListener('click', async () => {
            await supabase.auth.signOut()
            signInScreen()
          })

          host.append(buy, other)
        },
      })
    }

    /* ── tab switching ── */
    const tabs = [...document.querySelectorAll('.tab[data-view]')]
    function showView(view) {
      tabs.forEach((t) => t.classList.toggle('on', t.dataset.view === view))
      document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === `v-${view}`))
      const tab = tabs.find((t) => t.dataset.view === view)
      el('pane-title').textContent = tab.dataset.title
      el('pane-crumb').textContent = tab.dataset.crumb
    }
    tabs.forEach((tab) => tab.addEventListener('click', () => showView(tab.dataset.view)))

    // ── content ─────────────────────────────────────────────

    const KIND_LABEL = { video: 'Video', written: 'Read', download: 'Download', live: 'Live' }

    function orderedLessons() {
      return state.modules.flatMap((m) => state.lessons.filter((l) => l.module_id === m.id))
    }

    function renderIndex() {
      const host = el('index')
      host.textContent = ''

      for (const mod of state.modules) {
        const lessons = state.lessons.filter((l) => l.module_id === mod.id)
        if (!lessons.length) continue

        const group = document.createElement('div')
        group.className = 'toc-group'

        const cap = document.createElement('div')
        cap.className = 'cap label'
        cap.textContent = mod.title
        group.appendChild(cap)

        for (const lesson of lessons) {
          const btn = document.createElement('button')
          btn.type = 'button'
          const current = lesson.id === state.currentId
          if (current) {
            btn.className = 'on'
            btn.setAttribute('aria-current', 'true')
          }
          btn.textContent = lesson.title

          if (state.done.has(lesson.id)) {
            const dot = document.createElement('span')
            dot.className = 'done'
            dot.title = 'Completed'
            btn.appendChild(dot)
          }

          btn.addEventListener('click', () => openLesson(lesson.id))
          group.appendChild(btn)
        }

        host.appendChild(group)
      }
    }

    /** Minimal and deliberately text-only: headings and paragraphs, escaped. */
    function renderProse(host, md) {
      for (const block of md.split(/\n{2,}/)) {
        const trimmed = block.trim()
        if (!trimmed) continue
        const heading = trimmed.match(/^(#{2,3})\s+(.*)$/)
        const node = document.createElement(heading ? (heading[1].length === 2 ? 'h2' : 'h3') : 'p')
        node.textContent = heading ? heading[2] : trimmed
        host.appendChild(node)
      }
    }

    async function signedMedia(lessonId) {
      const { data: { session } } = await supabase.auth.getSession()
      const res = await fetch(`${SUPABASE_URL}/functions/v1/media-url`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${session?.access_token ?? ''}`,
        },
        body: JSON.stringify({ lesson_id: lessonId }),
      })
      const payload = await res.json().catch(() => ({}))
      if (!res.ok) throw new Error(payload.error ?? `${res.status}`)
      return payload
    }

    async function openLesson(id) {
      state.currentId = id
      renderIndex()
      renderOverview()

      const lesson = state.lessons.find((l) => l.id === id)
      const host = el('lesson')
      host.textContent = ''
      if (!lesson) return

      const kind = document.createElement('p')
      kind.className = 'label lesson-kind'
      kind.textContent = KIND_LABEL[lesson.kind] ?? lesson.kind
      host.appendChild(kind)

      const h = document.createElement('h1')
      h.className = 'lesson-h'
      h.textContent = lesson.title
      host.appendChild(h)

      if (lesson.summary) {
        const s = document.createElement('p')
        s.className = 'lesson-sum'
        s.textContent = lesson.summary
        host.appendChild(s)
      }

      if (lesson.kind === 'video') {
        const player = document.createElement('div')
        player.className = 'player'
        host.appendChild(player)
        try {
          const { url } = await signedMedia(lesson.id)
          const frame = document.createElement('iframe')
          frame.src = url
          frame.allow = 'accelerometer; gyroscope; encrypted-media; picture-in-picture; fullscreen'
          frame.allowFullscreen = true
          frame.loading = 'lazy'
          player.appendChild(frame)
        } catch (err) {
          player.remove()
          const notice = document.createElement('p')
          notice.className = 'notice'
          notice.textContent = `This video is not playable yet (${err.message}).`
          host.appendChild(notice)
        }
      }

      if (lesson.kind === 'download') {
        const notice = document.createElement('div')
        notice.className = 'lesson-foot'
        const btn = document.createElement('button')
        btn.className = 'btn'
        btn.textContent = 'Download'
        btn.addEventListener('click', async () => {
          btn.disabled = true
          btn.textContent = 'Preparing…'
          try {
            const { url } = await signedMedia(lesson.id)
            location.href = url
            btn.textContent = 'Download'
          } catch (err) {
            btn.textContent = `Not available (${err.message})`
          } finally {
            btn.disabled = false
          }
        })
        notice.appendChild(btn)
        host.appendChild(notice)
      }

      if (lesson.kind === 'live') {
        const notice = document.createElement('p')
        notice.className = 'notice'
        notice.textContent = 'Live session. Details are sent by email ahead of each one.'
        host.appendChild(notice)
      }

      if (lesson.body_md) {
        const prose = document.createElement('div')
        prose.className = 'prose'
        renderProse(prose, lesson.body_md)
        host.appendChild(prose)
      }

      // ── mark complete / next ──
      const foot = document.createElement('div')
      foot.className = 'lesson-foot'

      const done = state.done.has(lesson.id)
      const mark = document.createElement('button')
      mark.className = done ? 'rowbtn' : 'btn'
      mark.textContent = done ? 'Mark as not done' : 'Mark complete'
      mark.addEventListener('click', async () => {
        mark.disabled = true
        const nowDone = !state.done.has(lesson.id)
        const { error } = await supabase.from('progress').upsert({
          user_id: state.user.id,
          lesson_id: lesson.id,
          completed_at: nowDone ? new Date().toISOString() : null,
        }, { onConflict: 'user_id,lesson_id' })
        if (!error) {
          nowDone ? state.done.add(lesson.id) : state.done.delete(lesson.id)
          openLesson(lesson.id)
        } else {
          mark.disabled = false
          mark.textContent = 'Could not save'
        }
      })
      foot.appendChild(mark)

      const ordered = orderedLessons()
      const at = ordered.findIndex((l) => l.id === lesson.id)
      const next = ordered[at + 1]
      if (next) {
        const nextBtn = document.createElement('button')
        nextBtn.className = 'rowbtn'
        nextBtn.textContent = `Next: ${next.title}`
        nextBtn.addEventListener('click', () => {
          openLesson(next.id)
          window.scrollTo({ top: 0, behavior: 'smooth' })
        })
        foot.appendChild(nextBtn)
      }

      host.appendChild(foot)
    }

    // ── recaps ──────────────────────────────────────────────

    function openRecap(id) {
      state.currentRecap = id
      const r = state.recaps.find((x) => x.id === id)
      const blockEl = el('recap-reader-block')
      if (!r) { blockEl.hidden = true; return }
      blockEl.hidden = false
      el('recap-reader-date').textContent = whenDay(r.recap_date)
      const host = el('recap-reader')
      host.textContent = ''
      const h = document.createElement('h1')
      h.className = 'lesson-h'
      h.textContent = r.title
      host.appendChild(h)
      const prose = document.createElement('div')
      prose.className = 'prose'
      if (r.body_md) renderProse(prose, r.body_md)
      else { const p = document.createElement('p'); p.textContent = 'No notes on this one.'; prose.appendChild(p) }
      host.appendChild(prose)
      renderRecapList()
    }

    function renderRecapList() {
      el('c-recaps').textContent = String(state.recaps.length)
      el('recaps-total').textContent = `${state.recaps.length} total`
      el('recaps-empty').hidden = state.recaps.length > 0
      const tbl = el('recaps-table')
      tbl.textContent = ''
      if (!state.recaps.length) return
      const thead = document.createElement('thead'), htr = document.createElement('tr')
      for (const c of ['Date', 'Title', '']) { const th = document.createElement('th'); th.textContent = c; htr.appendChild(th) }
      thead.appendChild(htr)
      const tbody = document.createElement('tbody')
      for (const r of state.recaps) {
        const tr = document.createElement('tr')
        tr.className = 'rowlink'
        const d = document.createElement('td'); d.className = 'num'; d.textContent = whenDay(r.recap_date)
        const t = document.createElement('td'); t.className = 'ink'; t.textContent = r.title
        const b = document.createElement('td')
        if (r.is_published === false) {
          const badge = document.createElement('span'); badge.className = 'badge b-draft'; badge.textContent = 'draft'
          b.appendChild(badge)
        } else if (r.id === state.currentRecap) {
          const badge = document.createElement('span'); badge.className = 'badge b-live'; badge.textContent = 'reading'
          b.appendChild(badge)
        }
        tr.append(d, t, b)
        tr.addEventListener('click', () => { openRecap(r.id); window.scrollTo({ top: 0, behavior: 'smooth' }) })
        tbody.appendChild(tr)
      }
      tbl.append(thead, tbody)
    }

    // ── overview ────────────────────────────────────────────

    function scard(host, k, v, d) {
      const c = document.createElement('div'); c.className = 'scard'
      const kk = document.createElement('div'); kk.className = 'k'; kk.textContent = k
      const vv = document.createElement('div'); vv.className = 'v'; vv.textContent = v
      c.append(kk, vv)
      if (d) { const dd = document.createElement('div'); dd.className = 'd'; dd.textContent = d; c.appendChild(dd) }
      host.appendChild(c)
    }

    function renderOverview() {
      const total = state.lessons.length
      const done = [...state.done].filter((id) => state.lessons.some((l) => l.id === id)).length
      const pct = total ? Math.round((done / total) * 100) : 0

      const cards = el('ov-cards'); cards.textContent = ''
      scard(cards, 'Course progress', `${pct}%`, `${done} of ${total} lessons`)
      scard(cards, 'Lessons left', String(total - done))
      scard(cards, 'Trade recaps', String(state.recaps.length))
      scard(cards, 'Member since', state.user
        ? new Date(state.user.created_at).toLocaleDateString(undefined, { month: 'short', year: 'numeric' })
        : '—')

      const cont = el('ov-continue'); cont.textContent = ''
      const nextUp = orderedLessons().find((l) => !state.done.has(l.id)) ?? orderedLessons()[0]
      if (!nextUp) {
        const p = document.createElement('p'); p.className = 'lesson-sum'; p.style.marginTop = '0'
        p.textContent = 'No lessons published yet.'
        cont.appendChild(p)
      } else {
        const kind = document.createElement('p'); kind.className = 'label lesson-kind'
        kind.textContent = KIND_LABEL[nextUp.kind] ?? nextUp.kind
        const h = document.createElement('h1'); h.className = 'lesson-h'; h.textContent = nextUp.title
        cont.append(kind, h)
        if (nextUp.summary) {
          const s = document.createElement('p'); s.className = 'lesson-sum'; s.textContent = nextUp.summary
          cont.appendChild(s)
        }
        const foot = document.createElement('div'); foot.className = 'lesson-foot'
        const go = document.createElement('button'); go.className = 'btn'
        go.textContent = done ? 'Continue' : 'Start the course'
        go.addEventListener('click', () => { showView('course'); openLesson(nextUp.id) })
        foot.appendChild(go)
        cont.appendChild(foot)
      }

      const rec = el('ov-recap'); rec.textContent = ''
      const latest = state.recaps[0]
      if (!latest) {
        const p = document.createElement('p'); p.className = 'lesson-sum'; p.style.marginTop = '0'
        p.textContent = 'No recaps yet. They land here after each session.'
        rec.appendChild(p)
      } else {
        const kind = document.createElement('p'); kind.className = 'label lesson-kind'
        kind.textContent = whenDay(latest.recap_date)
        const h = document.createElement('h1'); h.className = 'lesson-h'; h.textContent = latest.title
        rec.append(kind, h)
        const foot = document.createElement('div'); foot.className = 'lesson-foot'
        const go = document.createElement('button'); go.className = 'btn'; go.textContent = 'Read it'
        go.addEventListener('click', () => { showView('recaps'); openRecap(latest.id) })
        foot.appendChild(go)
        rec.appendChild(foot)
      }
    }

    // ── boot ────────────────────────────────────────────────

    el('signout').addEventListener('click', async () => {
      await supabase.auth.signOut()
      location.reload()
    })

    async function loadCourse() {
      // These come back filtered by RLS: without an active entitlement the
      // modules query is simply empty, and trade recaps arrive published-only
      // for members. Nothing on this page can read other members' rows.
      const [{ data: modules }, { data: lessons }, { data: progress }, { data: recaps }] = await Promise.all([
        supabase.from('modules').select('id, title, position').order('position'),
        supabase.from('lessons').select('id, module_id, title, summary, kind, body_md, position').order('position'),
        supabase.from('progress').select('lesson_id, completed_at'),
        supabase.from('trade_recaps').select('id, title, recap_date, body_md, is_published').order('recap_date', { ascending: false }),
      ])

      state.modules = modules ?? []
      state.lessons = lessons ?? []
      state.done = new Set((progress ?? []).filter((p) => p.completed_at).map((p) => p.lesson_id))
      state.recaps = recaps ?? []

      el('gate').style.display = 'none'
      el('app').classList.add('on')

      const email = state.user.email
      el('u-name').textContent = email
      el('u-avatar').textContent = (email[0] || 'E').toUpperCase() + (email[1] || '·').toUpperCase()
      el('u-role').textContent = state.isAdmin ? 'Owner · Admin' : 'Member'

      el('admin-link').hidden = !state.isAdmin
      if (DISCORD_INVITE) {
        const link = el('discord-link')
        link.href = DISCORD_INVITE
        link.hidden = false
      }
      el('more-cap').hidden = el('admin-link').hidden && el('discord-link').hidden

      el('c-lessons').textContent = String(state.lessons.length)

      renderIndex()
      renderRecapList()
      if (state.recaps[0]) openRecap(state.recaps[0].id)
      renderOverview()

      const first = orderedLessons()[0]
      if (first) {
        openLesson(first.id)
      } else {
        el('lesson').innerHTML = '<p class="empty">No lessons published yet.</p>'
      }
    }

    async function boot() {
      const { data: { session } } = await supabase.auth.getSession()
      if (!session) return signInScreen()

      state.user = session.user

      // Paid, or runs the place. Admins get in without a purchase row so the
      // owner never has to fake a sale to look at their own course.
      const [{ data: ent }, { data: isAdmin }] = await Promise.all([
        supabase.from('entitlements').select('status').eq('status', 'active').maybeSingle(),
        supabase.rpc('is_admin'),
      ])

      if (!ent && !isAdmin) return noAccessScreen(session.user.email)
      state.isAdmin = !!isAdmin
      await loadCourse()
    }

    // Magic-link returns land here with tokens in the URL fragment;
    // supabase-js consumes them, then fires SIGNED_IN.
    supabase.auth.onAuthStateChange((event) => {
      if (event === 'SIGNED_IN' && !state.user) boot()
    })

    boot()
  </script>
</body>
</html>
