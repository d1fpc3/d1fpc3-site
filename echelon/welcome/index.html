<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Welcome to Echelon</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0908">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,340..680&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    /* Post-checkout. Stripe drops the buyer here with their session id; we
       trade it for a real session and put them inside the course. No email
       round-trip, because the moment after paying is the worst possible time
       to ask someone to go and check their inbox.
       Same language as the landing page at the site root. */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0908; --panel-2: #16130f;
      --ink: #f2ede3; --muted: #968d7e; --faint: #635c50;
      --line: rgba(242,237,227,0.09); --line-2: rgba(242,237,227,0.16);
      --gold: #c9a24a; --gold-bright: #e6cf95;
      --foil: linear-gradient(135deg, #6f5620 0%, #c9a24a 26%, #f3e3b6 47%, #fff6df 53%, #c9a24a 74%, #6f5620 100%);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(120% 80% at 78% -10%, rgba(201,162,74,0.06), transparent 55%);
    }

    .panel {
      width: 100%; max-width: 440px;
      border: 1px solid var(--line-2); border-radius: 16px;
      padding: 34px 30px;
      background: linear-gradient(180deg, var(--panel-2), #080706);
      box-shadow: 0 50px 90px -50px rgba(0,0,0,0.9);
    }
    .panel::before { content: ""; display: block; height: 1px; background: var(--foil); opacity: 0.6; margin: -34px -30px 30px; }

    .label {
      font-family: 'IBM Plex Mono', ui-monospace, monospace;
      font-size: 11px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--gold);
    }

    h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-weight: 500; font-size: clamp(30px, 8vw, 40px);
      line-height: 1.05; letter-spacing: -0.02em; margin-top: 14px;
    }

    p.body { margin-top: 14px; color: var(--muted); }

    .spinner {
      margin-top: 26px; width: 20px; height: 20px;
      border: 1px solid var(--line-2); border-top-color: var(--gold);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      margin-top: 24px; min-height: 48px; padding: 0 28px;
      background: var(--foil); background-size: 200% 100%; color: #1a1305;
      font-size: 14px; font-weight: 600; letter-spacing: 0.01em;
      text-decoration: none; border: 0; border-radius: 3px;
      box-shadow: 0 10px 34px -12px rgba(201,162,74,0.5);
      transition: transform 0.16s ease, background 0.2s ease, box-shadow 0.24s ease;
    }
    .btn:hover, .btn:focus-visible { transform: translateY(-1px); background-position: 100% 0; }
    @media (prefers-reduced-motion: reduce) { .btn:hover { transform: none; } }

    .quiet {
      display: inline-block; margin-top: 18px; margin-left: 4px; font-size: 13px;
      color: var(--faint); text-decoration: none;
      border-bottom: 1px solid var(--line-2);
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .quiet:hover, .quiet:focus-visible { color: var(--gold-bright); border-bottom-color: var(--gold); }

    a:focus-visible { outline: 1px solid var(--gold); outline-offset: 3px; }

    .fail .label { color: var(--muted); }

    [hidden] { display: none !important; }

    /* payment confirmation: a paper receipt against the dark room */
    .psx {
      width: 300px;
      background: #fff;
      border: 1px solid #ececef;
      border-radius: 18px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 30px 70px -30px rgba(0,0,0,0.8);
      animation: psx-in 0.35s ease-out;
    }
    @keyframes psx-in { from { opacity: 0; transform: translateY(8px); } }
    .psx svg { width: 56px; height: 56px; margin-bottom: 14px; }
    .psx circle {
      fill: none; stroke: #16a34a; stroke-width: 2.5;
      stroke-dasharray: 157; stroke-dashoffset: 157;
      transform: rotate(-90deg); transform-origin: center;
      animation: psx-c 0.6s ease-out forwards;
    }
    .psx path {
      fill: none; stroke: #16a34a; stroke-width: 3;
      stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 36; stroke-dashoffset: 36;
      animation: psx-k 0.35s ease-out 0.5s forwards;
    }
    @keyframes psx-c { to { stroke-dashoffset: 0; } }
    @keyframes psx-k { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .psx, .psx circle, .psx path { animation-duration: 0.01s; animation-delay: 0s; }
    }
    .psx b { display: block; font-size: 16px; font-weight: 600; color: #0a0a0a; }
    .psx .amt { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; color: #0a0a0a; margin: 6px 0 4px; }
    .psx small { display: block; font-size: 12px; color: #999; margin-bottom: 18px; word-break: break-all; }
    .psx a.enter {
      display: block; width: 100%; padding: 13px;
      border: 1.5px solid #e4e4e8; border-radius: 11px;
      background: #fff; font: 600 13.5px/1 inherit; color: #0a0a0a;
      cursor: pointer; text-decoration: none;
      transition: border-color 0.2s ease;
    }
    .psx a.enter:hover, .psx a.enter:focus-visible { border-color: #0a0a0a; }
  </style>
</head>
<body>
  <div class="panel" id="panel">
    <p class="label" id="state-label">Confirming your payment</p>
    <h1 id="state-title">One moment.</h1>
    <p class="body" id="state-body">Setting up your access now.</p>
    <div class="spinner" id="spinner"></div>
    <div id="actions"></div>
  </div>

  <div class="psx" id="psx" hidden>
    <svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="25"/><path d="M17 29l8 8 14-16"/></svg>
    <b>Payment complete</b>
    <div class="amt">$200.00</div>
    <small id="psx-who">Welcome to Echelon</small>
    <a class="enter" id="psx-enter" href="/echelon/app/">Open the course →</a>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const SUPABASE_URL = 'https://cqdignbleethroyxxvzr.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_bUU5exrU1uS4FKw_Dxnp-w_-dNjAo8x'
    const APP = '/echelon/app/'

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)

    const el = (id) => document.getElementById(id)

    function show({ label, title, body, actions = [], failed = false }) {
      el('spinner')?.remove()
      el('state-label').textContent = label
      el('state-title').textContent = title
      el('state-body').textContent = body
      if (failed) el('panel').classList.add('fail')

      const host = el('actions')
      host.textContent = ''
      for (const a of actions) {
        const link = document.createElement('a')
        link.href = a.href
        link.textContent = a.text
        link.className = a.primary ? 'btn' : 'quiet'
        host.appendChild(link)
        host.appendChild(document.createTextNode(' '))
      }
    }

    const sessionId = new URLSearchParams(location.search).get('session_id')

    // Someone already signed in who wanders back here just goes through.
    const { data: existing } = await supabase.auth.getSession()
    if (existing?.session && !sessionId) {
      location.replace(APP)
    } else if (!sessionId) {
      show({
        label: 'Nothing to confirm',
        title: 'No checkout found.',
        body: 'This page is where Stripe sends you after buying. If you already have access, sign in instead.',
        actions: [{ text: 'Sign in', href: APP, primary: true }, { text: 'Back to Echelon', href: '/' }],
        failed: true,
      })
    } else {
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/claim-access`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY },
          body: JSON.stringify({ session_id: sessionId }),
        })
        const payload = await res.json().catch(() => ({}))

        if (!res.ok) {
          // The purchase is real either way — the webhook has already granted
          // access. Only this one-click shortcut failed, so send them to the
          // ordinary sign-in rather than implying something went wrong.
          const expired = res.status === 410
          show({
            label: expired ? 'Link expired' : 'Almost there',
            title: expired ? 'That link has expired.' : 'Sign in to continue.',
            body: 'Your purchase is fine. Sign in with the email you paid with and we will send you a link.',
            actions: [{ text: 'Sign in', href: APP, primary: true }],
            failed: true,
          })
        } else {
          const { error } = await supabase.auth.verifyOtp({
            type: 'magiclink',
            token_hash: payload.token_hash,
          })
          if (error) throw error

          // Drop the session id out of the URL before moving on, so it does
          // not sit in history or leak through a referrer.
          history.replaceState(null, '', location.pathname)

          // The receipt moment: circle draws, check lands, then they enter.
          const { data: fresh } = await supabase.auth.getSession()
          const email = fresh?.session?.user?.email
          if (email) el('psx-who').textContent = `Signed in as ${email}`
          el('panel').hidden = true
          el('psx').hidden = false
          el('psx-enter').focus()
        }
      } catch (err) {
        console.error('claim failed', err)
        show({
          label: 'Almost there',
          title: 'Sign in to continue.',
          body: 'Your purchase went through. Sign in with the email you paid with and we will send you a link.',
          actions: [{ text: 'Sign in', href: APP, primary: true }],
          failed: true,
        })
      }
    }
  </script>
</body>
</html>
