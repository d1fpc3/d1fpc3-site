<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Echelon · Become a moderator</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root{
      --bg:#0b0a09; --panel:#151311; --line:#2a2622; --line-bright:#3a352f;
      --ink:#e9e4da; --faint:#9a9187; --dim:#6f675d;
      --gold:#c9a24a; --gold-2:#9c7b2e;
      --ok:#9fce97; --err:#e0a89b;
      color-scheme:dark;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%}
    body{
      background:var(--bg); color:var(--ink);
      font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
      display:flex; min-height:100vh; align-items:center; justify-content:center;
      padding:24px; -webkit-text-size-adjust:100%;
    }
    .orb{position:fixed; border-radius:50%; filter:blur(70px); opacity:.4; pointer-events:none; z-index:0}
    .o1{width:340px;height:340px;top:-90px;left:-80px;background:radial-gradient(circle,#3a2c10,transparent 70%)}
    .o2{width:300px;height:300px;bottom:-100px;right:-70px;background:radial-gradient(circle,#241a2e,transparent 70%)}
    .card{
      position:relative; z-index:1; width:100%; max-width:430px;
      background:var(--panel); border:1px solid var(--line); border-radius:18px;
      padding:30px 28px 28px;
    }
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
    .mark{
      width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
      background:linear-gradient(135deg,var(--gold),var(--gold-2)); color:#1a1207;
      font-weight:800;font-size:17px;letter-spacing:-.02em;
    }
    .brand b{font-size:15px;font-weight:650;letter-spacing:.02em}
    h1{font-size:22px;line-height:1.2;letter-spacing:-.02em;margin:2px 0 6px}
    p.sub{margin:0 0 22px;color:var(--faint);font-size:14px}
    label{display:block;font-size:11px;letter-spacing: 0.02em;color:var(--faint);margin:16px 0 7px}
    .inp{
      width:100%; background:#0f0d0b; border:1px solid var(--line); border-radius:11px;
      color:var(--ink); padding:13px 14px; font-size:16px;
    }
    .inp:focus{outline:none;border-color:var(--gold)}
    .pw{position:relative}
    .pw .toggle{
      position:absolute; right:8px; top:50%; transform:translateY(-50%);
      background:none;border:0;color:var(--dim);font-size:12px;letter-spacing:.05em;
cursor:pointer;padding:6px 8px;
    }
    small{display:block;color:var(--dim);font-size:12px;margin-top:7px}
    button.go{
      margin-top:24px; width:100%; border:0; border-radius:11px; cursor:pointer;
      background:linear-gradient(135deg,var(--gold),var(--gold-2)); color:#1a1207;
      padding:14px; font-weight:700; font-size:15px; letter-spacing:.01em;
    }
    button.go:disabled{opacity:.55;cursor:default}
    .msg{margin-top:16px;font-size:13.5px;padding:12px 14px;border-radius:11px;display:none;line-height:1.5}
    .msg.ok{display:block;background:rgba(134,181,127,.12);color:var(--ok);border:1px solid rgba(134,181,127,.3)}
    .msg.err{display:block;background:rgba(208,138,122,.12);color:var(--err);border:1px solid rgba(208,138,122,.3)}
    .msg a{color:var(--gold);font-weight:600}
    .foot{margin-top:20px;font-size:12px;color:var(--dim);text-align:center}
    .done .foot,.done form{display:none}
  </style>
</head>
<body>
  <span class="orb o1"></span><span class="orb o2"></span>
  <div class="card" id="card">
    <div class="brand"><span class="mark">E</span><b>ECHELON</b></div>
    <h1>Become a moderator</h1>
    <p class="sub">You were invited to help run the Echelon room. Set your password and you're in.</p>

    <form id="form">
      <label for="email">Your email</label>
      <input class="inp" id="email" type="email" autocomplete="email" inputmode="email"
             spellcheck="false" placeholder="the email we approved">

      <label for="pass">Create a password</label>
      <div class="pw">
        <input class="inp" id="pass" type="password" autocomplete="new-password"
               placeholder="8 characters or more">
        <button type="button" class="toggle" id="toggle">Show</button>
      </div>
      <small>You'll use this email and password to sign in to Echelon.</small>

      <button class="go" id="go" type="submit">Create moderator account</button>
    </form>

    <div id="msg" class="msg"></div>
    <p class="foot">Not expecting this? You can close the page.</p>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
    const SUPABASE_URL = 'https://cqdignbleethroyxxvzr.supabase.co'
    const SUPABASE_KEY = 'sb_publishable_bUU5exrU1uS4FKw_Dxnp-w_-dNjAo8x'
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY)
    const APP = 'https://d1fpc3.com/echelon/app/'

    const $ = (id) => document.getElementById(id)
    const msg = $('msg')
    const show = (cls, html) => { msg.className = 'msg ' + cls; msg.innerHTML = html }

    $('toggle').addEventListener('click', () => {
      const p = $('pass')
      const on = p.type === 'password'
      p.type = on ? 'text' : 'password'
      $('toggle').textContent = on ? 'Hide' : 'Show'
    })

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const email = $('email').value.trim().toLowerCase()
      const password = $('pass').value
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return show('err', 'Enter a real email.')
      if (password.length < 8) return show('err', 'Password needs at least 8 characters.')

      $('go').disabled = true; show('', 'Setting you up…'); msg.className = 'msg'; msg.style.display = 'block'
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/mod-signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY },
          body: JSON.stringify({ email, password }),
        })
        const body = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(body.error ?? `Something went wrong (${res.status}).`)

        if (body.created) {
          // Fresh account with the password they just set — sign straight in.
          show('ok', "You're a moderator now. Taking you into Echelon…")
          const { error } = await supabase.auth.signInWithPassword({ email, password })
          if (error) {
            show('ok', "You're a moderator now. <a href='" + APP + "'>Open Echelon</a> and sign in.")
            $('card').classList.add('done')
          } else {
            location.href = APP
          }
        } else {
          // They already had an account — role added, password untouched.
          show('ok', "You're a moderator now. You already have an account, so <a href='" + APP + "'>sign in to Echelon</a> with your usual login.")
          $('card').classList.add('done')
        }
      } catch (err) {
        show('err', err.message)
        $('go').disabled = false
      }
    })
  </script>
</body>
</html>
