<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>d1fpc3</title>
  <link rel="icon" type="image/svg+xml" href="https://d1fpc3.com/favicon.svg">
  <meta name="description" content="d1fpc3: tell us what you want built. A tool, a site, an app, a feature. The good ones get made.">
  <link rel="canonical" href="https://d1fpc3.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://d1fpc3.com/">
  <meta property="og:title" content="d1fpc3">
  <meta property="og:description" content="Tell us what you want built. A tool, a site, an app, a feature. The good ones get made.">
  <!-- SeenRank Pixel -->
  <script async src="https://seenrank.com/pixel.js" data-sr-site="d19bf048-ec87-453a-aa7f-b264637a7360"></script>
  <style>
    /* ─────────────────────────────────────────────────────────
       d1fpc3.com | index
       A single question in the site's own language:
       flat typographic form, hairline dividers, sparse gold.
       ───────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --ink: #0a0a0a;
      --muted: #666666;
      --faint: #999999;
      --line: #e5e5e5;
      --gold: #a8842c;
    }

    html { height: 100%; }

    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.7;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding-left: clamp(20px, 6vw, 40px);
      padding-right: clamp(20px, 6vw, 40px);
    }

    a { color: inherit; }

    /* ── header ─────────────────────────────────────────── */

    header {
      padding-top: clamp(44px, 10vh, 96px);
      text-align: center;
    }

    .monogram {
      width: 88px;
      height: 88px;
      margin: 0 auto;
      border-radius: 50%;
      border: 1px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 28px;
      letter-spacing: -0.01em;
      line-height: 1;
      user-select: none;
    }

    h1 {
      font-weight: 700;
      font-size: clamp(36px, 9vw, 52px);
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-top: 22px;
    }

    .lede {
      margin: 18px auto 0;
      max-width: 44ch;
      color: var(--muted);
    }

    /* ── form ───────────────────────────────────────────── */

    main { padding: clamp(40px, 8vh, 64px) 0 8px; }

    .field { padding: 0 0 26px; text-align: left; }

    .field-label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--faint);
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .field-label .optional { color: var(--line); }

    textarea,
    input[type="email"] {
      display: block;
      width: 100%;
      border: none;
      border-bottom: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font: inherit;
      padding: 16px 0 14px;
      border-radius: 0;
      transition: border-color 0.2s ease;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    textarea::placeholder,
    input::placeholder { color: var(--faint); }

    textarea:focus,
    input:focus {
      outline: none;
      border-bottom-color: var(--gold);
    }

    .hint {
      margin-top: 8px;
      font-size: 12px;
      color: var(--faint);
    }

    /* honeypot: kept out of sight, real people never see it */
    .leave-blank {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    /* ── submit row ─────────────────────────────────────── */

    .send-row {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-top: 6px;
    }

    button[type="submit"] {
      appearance: none;
      background: transparent;
      border: 1px solid var(--ink);
      color: var(--ink);
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      padding: 12px 28px;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    button[type="submit"]:hover,
    button[type="submit"]:focus-visible {
      color: var(--gold);
      border-color: var(--gold);
      outline: none;
    }

    button[type="submit"]:disabled {
      color: var(--faint);
      border-color: var(--line);
      cursor: default;
    }

    .form-note {
      font-size: 12px;
      color: var(--faint);
    }

    .form-error { color: var(--gold); }

    /* ── sent state ─────────────────────────────────────── */

    .sent {
      display: none;
      padding: 8px 0 26px;
      text-align: left;
    }

    .sent p:first-child {
      font-weight: 600;
      font-size: clamp(20px, 4.5vw, 25px);
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .sent p + p {
      margin-top: 10px;
      color: var(--muted);
    }

    .sent a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--gold);
      transition: color 0.2s ease;
    }

    .sent a:hover,
    .sent a:focus-visible { color: var(--gold); }

    /* ── footer ─────────────────────────────────────────── */

    footer {
      margin-top: auto;
      padding: 40px 0 28px;
    }

    footer .foot {
      border-top: 1px solid var(--line);
      padding-top: 16px;
      font-size: 11px;
      color: var(--faint);
      letter-spacing: 0.04em;
    }

    /* ── entrance ───────────────────────────────────────── */

    @media (prefers-reduced-motion: no-preference) {
      .rise {
        opacity: 0;
        transform: translateY(10px);
        animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .rise:nth-of-type(1) { animation-delay: 0s; }
      header .rise:nth-child(2) { animation-delay: 0.06s; }
      header .rise:nth-child(3) { animation-delay: 0.10s; }
      main .rise:nth-child(1) { animation-delay: 0.18s; }
      main .rise:nth-child(2) { animation-delay: 0.24s; }
      main .rise:nth-child(3) { animation-delay: 0.30s; }
      @keyframes rise {
        to { opacity: 1; transform: none; }
      }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="monogram rise"><span>d1</span></div>
    <h1 class="rise">What do you want?</h1>
    <p class="lede rise">Things get built here. Tell us what you'd want next: a tool, a site, an app, a feature. Plain words are fine, and the good ones get made.</p>
  </header>

  <main class="wrap">
    <form id="want-form" novalidate>
      <div class="field rise">
        <label class="field-label" for="want">WHAT DO YOU WANT</label>
        <textarea id="want" name="want" maxlength="5000" required
          placeholder="The thing you wish existed, and what it would do for you."></textarea>
      </div>

      <div class="field rise">
        <label class="field-label" for="email">EMAIL <span class="optional">· OPTIONAL</span></label>
        <input type="email" id="email" name="email" maxlength="320" autocomplete="email"
          placeholder="you@example.com">
        <p class="hint">Only used to follow up on this, nothing else.</p>
      </div>

      <div class="leave-blank" aria-hidden="true">
        <label for="website">Leave this field empty</label>
        <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <div class="send-row rise">
        <button type="submit" id="send-btn">SEND</button>
        <p class="form-note" id="form-note" role="status"></p>
      </div>
    </form>

    <div class="sent" id="sent" role="status">
      <p>Got it. Thank you.</p>
      <p id="sent-detail">If you left an email, you'll hear back. <a href="/" id="send-another">Send another</a></p>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <div class="foot">© 2026 d1fpc3</div>
    </div>
  </footer>

  <script>
    (function () {
      var ENDPOINT = 'https://cqdignbleethroyxxvzr.supabase.co/rest/v1/site_requests';
      var KEY = 'sb_publishable_bUU5exrU1uS4FKw_Dxnp-w_-dNjAo8x';

      var form = document.getElementById('want-form');
      var btn = document.getElementById('send-btn');
      var note = document.getElementById('form-note');
      var sent = document.getElementById('sent');

      form.addEventListener('submit', function (e) {
        e.preventDefault();

        var want = document.getElementById('want').value.trim();
        var email = document.getElementById('email').value.trim();
        var trap = document.getElementById('website').value;

        note.classList.remove('form-error');
        if (want.length < 3) {
          note.classList.add('form-error');
          note.textContent = 'Say a little more first.';
          document.getElementById('want').focus();
          return;
        }

        // bots fill the hidden field; let them think it worked
        if (trap) { showSent(); return; }

        btn.disabled = true;
        btn.textContent = 'SENDING…';
        note.textContent = '';

        fetch(ENDPOINT, {
          method: 'POST',
          headers: {
            'apikey': KEY,
            'Authorization': 'Bearer ' + KEY,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal'
          },
          body: JSON.stringify({
            want: want,
            email: email || null,
            source: 'home'
          })
        }).then(function (res) {
          if (!res.ok) throw new Error('bad status ' + res.status);
          showSent();
        }).catch(function () {
          btn.disabled = false;
          btn.textContent = 'SEND';
          note.classList.add('form-error');
          note.textContent = 'That didn’t go through. Try once more?';
        });
      });

      function showSent() {
        form.style.display = 'none';
        sent.style.display = 'block';
        document.getElementById('send-another').addEventListener('click', function (e) {
          e.preventDefault();
          form.reset();
          btn.disabled = false;
          btn.textContent = 'SEND';
          note.textContent = '';
          sent.style.display = 'none';
          form.style.display = '';
          document.getElementById('want').focus();
        });
      }
    })();
  </script>
</body>
</html>
