<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Member reviews · Echelon by d1</title>
  <meta name="description" content="What Echelon members say — every approved review, straight from the room.">
  <link rel="icon" type="image/svg+xml" href="/echelon-favicon.svg">
  <link rel="apple-touch-icon" href="/echelon/assets/logo-mark.png">
  <link rel="canonical" href="https://d1fpc3.com/reviews/">
  <meta property="og:title" content="Member reviews · Echelon by d1">
  <meta property="og:description" content="What Echelon members say — every approved review, straight from the room.">
  <style>
    :root {
      --bg: #0b0a09; --panel: #131211; --panel-2: #1a1817;
      --ink: #f4f2ee; --muted: #9d978c; --faint: #6b665e;
      --line: #262321; --line-bright: #383431;
      --gold: #c9a24a; --gold-deep: #a8842c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; scrollbar-width: none; }
    *::-webkit-scrollbar { width: 0; height: 0; display: none; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased; line-height: 1.5;
    }
    a { color: inherit; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
    .label { font-size: 10.5px; letter-spacing: 0.02em; color: var(--faint); }
    .col { max-width: 1080px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 40px); }
    .top { position: sticky; top: 0; z-index: 50; background: rgba(11,10,9,0.92); border-bottom: 1px solid var(--line); }
    @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .top { background: rgba(11,10,9,0.78); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    }
    .top .col { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; padding-bottom: 14px; gap: 14px; }
    .brand { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; text-decoration: none; }
    .quiet { color: var(--muted); text-decoration: none; font-size: 13.5px; }
    .quiet:hover { color: var(--ink); }
    main { padding: clamp(44px, 8vh, 84px) 0 clamp(56px, 9vh, 96px); }
    h1 { font-size: clamp(26px, 4.4vw, 40px); font-weight: 700; letter-spacing: -0.03em; text-align: center; margin-top: 10px; }
    .lede { text-align: center; color: var(--muted); font-size: 14.5px; margin-top: 10px; }
    .head-label { display: block; text-align: center; }

    .ratesum { display: flex; gap: 20px; align-items: center; max-width: 320px; margin: 26px auto 0; padding: 16px 18px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--line); }
    .ratesum .left { text-align: center; flex: none; }
    .ratesum .big { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
    .ratesum .rs-stars { color: var(--gold); font-size: 12px; letter-spacing: 2px; margin: 5px 0 3px; }
    .ratesum .n { font-size: 11px; color: var(--faint); }
    .ratesum .bars { flex: 1; display: grid; gap: 6px; }
    .ratesum .r { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--faint); }
    .ratesum .r b { width: 8px; font-weight: 500; color: var(--muted); }
    .ratesum .track { flex: 1; height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
    .ratesum .track i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gold), var(--gold-deep)); width: 0; animation: rate-grow 1s cubic-bezier(0.77, 0, 0.175, 1) forwards; }
    .ratesum .r:nth-child(1) i { animation-delay: 0.1s; }
    .ratesum .r:nth-child(2) i { animation-delay: 0.2s; }
    .ratesum .r:nth-child(3) i { animation-delay: 0.3s; }
    .ratesum .r:nth-child(4) i { animation-delay: 0.4s; }
    .ratesum .r:nth-child(5) i { animation-delay: 0.5s; }
    @keyframes rate-grow { to { width: var(--w); } }
    @media (prefers-reduced-motion: reduce) { .ratesum .track i { animation: none; width: var(--w); } }

    .cols { margin-top: 34px; columns: 3; column-gap: 16px; }
    @media (max-width: 900px) { .cols { columns: 2; } }
    @media (max-width: 640px) { .cols { columns: 1; } }
    .rev {
      break-inside: avoid; margin-bottom: 16px; padding: 18px 20px;
      border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }
    .rev:hover { transform: translateY(-3px); box-shadow: 0 16px 36px -22px rgba(0,0,0,0.65); }
    .rev .stars { display: block; color: var(--gold); font-size: 11px; letter-spacing: 2px; margin-bottom: 8px; }
    .rev p { margin: 0 0 12px; font-size: 13px; line-height: 1.55; color: var(--muted); }
    .rev .who { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--faint); }
    .rev .ava {
      width: 24px; height: 24px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
      background: linear-gradient(140deg, var(--gold), var(--gold-deep)); color: #1a1207;
      font-weight: 700; font-size: 10px; display: flex; align-items: center; justify-content: center;
    }
    .rev .ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rev .who b { color: var(--ink); font-weight: 600; }
    .empty { text-align: center; color: var(--faint); font-size: 14px; margin-top: 40px; }

    footer { border-top: 1px solid var(--line); padding: 26px 0 34px; }
    footer .base { display: flex; justify-content: space-between; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--faint); }
    footer a { color: var(--faint); text-decoration: none; }
    footer a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <header class="top"><div class="col">
    <a class="brand" href="/"><img src="/echelon/assets/logo-mark.png" alt="" width="26" height="26" style="border-radius:6px;vertical-align:-7px;margin-right:9px">Echelon</a>
    <nav style="display:flex;gap:22px;align-items:center;">
      <a class="quiet" href="/pricing/">Pricing</a>
      <a class="quiet" href="/echelon/app/">Sign in</a>
    </nav>
  </div></header>

  <main><div class="col">
    <span class="label head-label">From the members</span>
    <h1>Every review, unedited.</h1>
    <p class="lede">Written by members inside the app. We choose which appear publicly — we don't change a word.</p>
    <div class="ratesum" id="rev-sum" hidden></div>
    <div class="cols" id="rev-grid"></div>
    <p class="empty" id="rev-empty" hidden>Nothing published yet.</p>
  </div></main>

  <footer><div class="col">
    <div class="base">
      <span>© 2026 Echelon · d1fpc3</span>
      <span style="display:flex;gap:22px;flex-wrap:wrap;">
        <a href="/">Home</a>
        <a href="/pricing/">Pricing</a>
        <a href="/echelon/app/">Members</a>
      </span>
    </div>
  </div></footer>

  <script>
    var SB = 'https://cqdignbleethroyxxvzr.supabase.co';
    var SB_KEY = 'sb_publishable_bUU5exrU1uS4FKw_Dxnp-w_-dNjAo8x';
    /* Approved member reviews (landing_reviews view). Usernames and
       comments are member-authored, so everything lands via textContent. */
    fetch(SB + '/rest/v1/public_reviews?select=*', { headers: { apikey: SB_KEY } })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
      .then(function (rows) {
        var rated = (rows || []).filter(function (r) { return r.rating; });
        rows = (rows || []).filter(function (r) { return r.username && r.comment && r.comment.trim(); });
        if (rated.length) {
          var counts = [0, 0, 0, 0, 0], sum = 0;
          rated.forEach(function (r) {
            var v = Math.max(1, Math.min(5, r.rating | 0));
            counts[v - 1]++; sum += v;
          });
          var box = document.getElementById('rev-sum');
          var left = document.createElement('div'); left.className = 'left';
          var big = document.createElement('div'); big.className = 'big'; big.textContent = (sum / rated.length).toFixed(1);
          var st = document.createElement('div'); st.className = 'rs-stars'; st.textContent = '★★★★★';
          var nn = document.createElement('div'); nn.className = 'n'; nn.textContent = rated.length + (rated.length > 1 ? ' reviews' : ' review');
          left.appendChild(big); left.appendChild(st); left.appendChild(nn); box.appendChild(left);
          var bars = document.createElement('div'); bars.className = 'bars';
          for (var s = 5; s >= 1; s--) {
            var row = document.createElement('div'); row.className = 'r';
            var bb = document.createElement('b'); bb.textContent = s;
            var track = document.createElement('span'); track.className = 'track';
            var fill = document.createElement('i');
            fill.style.setProperty('--w', Math.round((counts[s - 1] / rated.length) * 100) + '%');
            track.appendChild(fill); row.appendChild(bb); row.appendChild(track); bars.appendChild(row);
          }
          box.appendChild(bars);
          box.hidden = false;
        }
        if (!rows.length) { document.getElementById('rev-empty').hidden = false; return; }
        var grid = document.getElementById('rev-grid');
        rows.forEach(function (r) {
          var card = document.createElement('div'); card.className = 'rev';
          var stars = document.createElement('span'); stars.className = 'stars';
          var n = Math.max(1, Math.min(5, r.rating | 0));
          stars.textContent = '★'.repeat(n) + '☆'.repeat(5 - n);
          var c = document.createElement('p'); c.textContent = '“' + r.comment.trim() + '”';
          var who = document.createElement('div'); who.className = 'who';
          var ava = document.createElement('span'); ava.className = 'ava';
          if (r.avatar_url && r.avatar_url.indexOf(SB + '/storage/v1/object/public/avatars/') === 0) {
            var img = document.createElement('img');
            img.src = r.avatar_url; img.alt = ''; img.loading = 'lazy';
            ava.appendChild(img);
          } else {
            ava.textContent = r.username.slice(0, 1).toUpperCase();
          }
          var u = document.createElement('b'); u.textContent = '@' + r.username;
          who.appendChild(ava); who.appendChild(u);
          card.appendChild(stars); card.appendChild(c); card.appendChild(who);
          grid.appendChild(card);
        });
      })
      .catch(function () { document.getElementById('rev-empty').hidden = false; });
  </script>
</body>
</html>
