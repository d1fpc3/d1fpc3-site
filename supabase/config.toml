# Echelon: only functions that live in this repo are declared here. The rest
# (stripe-webhook, admin-api, send-push, ...) are deployed from D1's other
# machine and must not be touched by a deploy from this checkout.
project_id = "cqdignbleethroyxxvzr"

[functions.tape]
verify_jwt = true

# tv-sync is called by a pg_net trigger and cron with x-webhook-secret (no JWT),
# and verifies member/admin JWTs itself for the app and admin calls.
[functions.tv-sync]
verify_jwt = false

# discord-video-alert is called by cron through pg_net with the service-role key.
# verify_jwt stays true on purpose: with no shared secret in play the gateway is
# the first of the two gates, and the function checks the key itself for the second.
[functions.discord-video-alert]
verify_jwt = true

# media-url signs lesson, recap and library media for members (JWT). Source
# pulled from the live bundle 2026-09-16 so captions could ride along; this
# checkout is its source of truth from here on.
[functions.media-url]
verify_jwt = true

# send-push authenticates by x-webhook-secret (pg_cron, triggers, the tos-gex job), never a
# JWT. verify_jwt MUST stay false: a deploy with it true 401s every Echelon push. Source copied
# into this repo 2026-09-27 (custom GEX alerts + vol in the GEX pushes); the Deb machine copy
# is older, so deploy send-push from here from now on.
[functions.send-push]
verify_jwt = false

# radar: deal and event alerts for D1 (10/8/26). Called by pg_cron through radar_kick with x-webhook-secret,
# and by Admin > Radar with D1's session (the function checks the owner uid itself).
[functions.radar]
verify_jwt = false
